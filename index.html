  // 클릭 처리
  function evtPos(e) {
    const rect = cv.getBoundingClientRect();
    return { mx: (e.clientX - rect.left) * (W / rect.width), my: (e.clientY - rect.top) * (H / rect.height) };
  }
  function inRect(mx, my, r) { return mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h; }

  cv.addEventListener('click', (e) => {
    const { mx, my } = evtPos(e);
    if (state === 'LOSE') { state = 'MENU'; return; }
    if (state === 'UPGRADE') {
      for (let i = 0; i < 3; i++) if (inRect(mx, my, cardRect(i))) { applyUpgrade(i); return; }
      return;
    }
    if (state === 'SHOP') {
      if (inRect(mx, my, loginBtn())) { doLogin(); return; }
      if (inRect(mx, my, backBtn())) { state = 'MENU'; return; }
      for (let i = 0; i < SHOP_IDS.length; i++) {
        if (inRect(mx, my, shopBuyRect(i))) {
          const id = SHOP_IDS[i], it = ITEMS[id];
          if (currentUser && profile.gold >= it.cost) {
            profile.gold -= it.cost;
            profile.owned[id] = (profile.owned[id] || 0) + 1;
            saveProfile();
          }
          return;
        }
      }
      if (inRect(mx, my, shopBuyRect(slotRowIndex()))) {   // 칸 추가 (최대 9칸)
        if (currentUser && profile.slots < 9 && profile.gold >= profile.slotCost) {
          profile.gold -= profile.slotCost;
          profile.slots += 1;
          profile.slotCost *= 2;   // 살 때마다 2배
          saveProfile();
        }
        return;
      }
      return;
    }
    if (state === 'EQUIP') {
      if (inRect(mx, my, loginBtn())) { doLogin(); return; }
      if (inRect(mx, my, backBtn())) { state = 'MENU'; return; }
      if (inRect(mx, my, unequipAllBtn())) { if (profile.equipped.length) { profile.equipped = []; saveProfile(); equipMsg = { text: '모든 도구를 해제했습니다', life: 90 }; } return; }
      return;
    }
    if (state === 'WIN') { if (inRect(mx, my, backBtn2())) state = 'MENU'; return; }
    if (state === 'MENU') {
      for (let i = 0; i < 2; i++) if (inRect(mx, my, schemeChip(i))) { controlScheme = i+1; return; }
      if (inRect(mx, my, loginBtn())) { doLogin(); return; }
      if (inRect(mx, my, shopBtn())) { state = 'SHOP'; panelScroll = 0; return; }
      if (inRect(mx, my, equipBtn())) { state = 'EQUIP'; panelScroll = 0; return; }
      if (inRect(mx, my, startBtn())) { startIntro(); return; }
    }
  });

  // ---------- 도구 장착 드래그앤드롭 ----------
  cv.addEventListener('mousedown', (e) => {
    if (state !== 'EQUIP') return;
    const { mx, my } = evtPos(e);
    // 장착된 아이템(칸) 위에서 시작 → 해제 드래그
    let si = 0;
    for (let eq = 0; eq < profile.equipped.length; eq++) {
      const id = profile.equipped[eq], it = ITEMS[id]; if (!it) continue;
      const s0 = slotRect(si), s1 = slotRect(si + it.slots - 1);
      const r = { x: s0.x, y: s0.y, w: (s1.x + s1.w) - s0.x, h: s0.h };
      if (inRect(mx, my, r)) { drag = { from: 'equip', id, index: eq }; dragX = mx; dragY = my; return; }
      si += it.slots;
    }
    // 인벤토리에서 시작 → 장착 드래그
    const list = invList();
    for (let i = 0; i < list.length; i++) {
      if (inRect(mx, my, invRect(i))) { drag = { from: 'inv', id: list[i].id, index: i }; dragX = mx; dragY = my; return; }
    }
  });
  cv.addEventListener('mousemove', (e) => {
    if (!drag) return;
    const { mx, my } = evtPos(e); dragX = mx; dragY = my;
  });
  // 상점/장착 스크롤
  cv.addEventListener('wheel', (e) => {
    if (state !== 'SHOP' && state !== 'EQUIP') return;
    e.preventDefault();
    let maxScroll = 0;
    if (state === 'SHOP') {
      const contentBottom = 100 + (SHOP_IDS.length + 1) * 62;   // 마지막 행 하단
      maxScroll = Math.max(0, contentBottom - (H - 70));
    } else {
      const rows = Math.ceil(invList().length / 6);
      const contentBottom = 320 + rows * 100;
      maxScroll = Math.max(0, contentBottom - (H - 60));
    }
    panelScroll = clamp(panelScroll + (e.deltaY > 0 ? 48 : -48), 0, maxScroll);
  }, { passive: false });
  cv.addEventListener('mouseup', (e) => {
    if (!drag) return;
    const { mx, my } = evtPos(e);
    const overEquip = my >= 120 && my <= 252;   // 장착 칸 영역
    if (drag.from === 'inv' && overEquip) {
      if (canEquip(drag.id)) { profile.equipped.push(drag.id); saveProfile(); }
      else { equipMsg = { text: '장착 불가 (칸/고유/특수 제약)', life: 90 }; }
    } else if (drag.from === 'equip' && !overEquip) {
      profile.equipped.splice(drag.index, 1); saveProfile();
    }
    drag = null;
  });

  // ---------- 입장 연출 ----------
  function startIntro() {
    resetGame();
    boss.y = -boss.h - 60;        // 화면 위 (하늘)
    boss.vy = 0;
    boss.roar = false;
    intro = { phase: 1, timer: 0, shake: 0, p: 0 };
    state = 'INTRO';
  }

  function updateIntro() {
    if (intro.shake > 0.5) intro.shake *= 0.86; else intro.shake = 0;
    switch (intro.phase) {
      case 1: {  // 하늘에서 떨어지며 등장
        boss.vy += 1.0;
        boss.y += boss.vy;
        if (boss.y >= GROUND_Y - boss.h) {
          boss.y = GROUND_Y - boss.h;
          boss.vy = 0;
          intro.shake = 26;        // 착지 화면 흔들림
          spawnParticles(boss.x + boss.w/2, GROUND_Y - 6, '#b9a88a', 30, 8);
          intro.phase = 2; intro.timer = 120;   // 2초 대기
        }
        break;
      }
      case 2: {  // 2초 대기
        intro.timer--;
        if (intro.timer <= 0) { intro.phase = 3; intro.timer = 0; }
        break;
      }
      case 3: {  // 얼굴 확대 + 포효 + 텍스트
        intro.timer++;
        intro.p = Math.min(1, intro.timer / 28);     // 줌인
        if (intro.timer === 30) {                    // 포효 시작
          boss.roar = true;
          intro.shake = 16;
          spawnParticles(boss.x + boss.w/2, boss.y + 44, '#ffe08a', 24, 9);
        }
        if (intro.timer >= 125) { intro.phase = 4; intro.timer = 0; }
        break;
      }
      case 4: {  // 줌아웃 + 텍스트 사라짐
        intro.timer++;
        intro.p = Math.max(0, 1 - intro.timer / 32);
        if (intro.timer >= 36) { boss.roar = false; intro = null; state = 'PLAY'; }
        break;
      }
    }
    // 파티클은 계속 갱신
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; }
    particles = particles.filter(p => p.life > 0);
  }

  function drawIntro() {
    if (!intro) return;   // 연출 종료 프레임 방어 (intro가 막 null이 된 경우)
    ctx.save();
    const sh = intro.shake;
    if (sh > 0) ctx.translate((Math.random()-0.5)*sh, (Math.random()-0.5)*sh);
    // 얼굴쪽으로 카메라 줌
    const p = intro.p || 0;
    const s = 1 + 1.7 * p;
    const fxw = boss.x + boss.w/2, fyw = boss.y + 40;   // 김태양 얼굴 (포커스)
    ctx.translate(lerp(fxw, W*0.62, p), lerp(fyw, H*0.42, p));
    ctx.scale(s, s);
    ctx.translate(-fxw, -fyw);
    drawBackground();
    drawProjectiles();
    drawBoss();
    drawPlayer();
    // 포효 방사선
    if (boss.roar) {
      ctx.strokeStyle = `rgba(255,220,140,${0.25 + 0.2*Math.abs(Math.sin(frame*0.5))})`;
      ctx.lineWidth = 3;
      for (let i = 0; i < 10; i++) {
        const ang = (i / 10) * Math.PI * 2 + frame * 0.04;
        const r1 = 46, r2 = 46 + 22 + 8*Math.sin(frame*0.4 + i);
        ctx.beginPath();
        ctx.moveTo(fxw + Math.cos(ang)*r1, fyw + Math.sin(ang)*r1);
        ctx.lineTo(fxw + Math.cos(ang)*r2, fyw + Math.sin(ang)*r2);
        ctx.stroke();
      }
    }
    ctx.restore();

    // 텍스트 (화면 왼쪽, 줌과 무관한 화면좌표)
    if (intro.phase >= 3) {
      let a = 1;
      if (intro.phase === 3) a = clamp((intro.timer - 28) / 18, 0, 1);
      else a = Math.max(0, 1 - intro.timer / 26);
      ctx.globalAlpha = a;
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(40, H*0.5 - 56, 430, 96);
      ctx.fillStyle = '#9aa4c8';
      ctx.font = 'bold 26px "Trebuchet MS", sans-serif';
      ctx.fillText('Master of gas,', 60, H*0.5 - 12);
      ctx.save();
      ctx.shadowColor = '#ff6b3d'; ctx.shadowBlur = 18;
      ctx.fillStyle = '#ffd24a';
      ctx.font = 'bold 56px "Trebuchet MS", sans-serif';
      ctx.fillText("'Ssunang'", 60, H*0.5 + 30);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  // ---------- 강화(분노) 연출 : HP 150 이하 ----------
  function startEnrage() {
    boss.enraged = true;          // 재발동 방지 + 패턴 강화 플래그
    burps = []; fartZones = []; laser = null;
    player.castTimer = 0;
    boss.state = 'approach'; boss.swingTimer = 0; boss.stun = 0;
    boss.sub = 0; boss.subTimer = 0; boss.roar = false; boss.flash = 0;
    enrage = { phase: 1, timer: 0, shake: 18, p: 0, vx: 9, fired: 0, subTimer: 0 };
    state = 'ENRAGE';
  }

  function updateEnrage() {
    const e = enrage;
    if (e.shake > 0.5) e.shake *= 0.86; else e.shake = 0;
    const c = boss.x + boss.w/2, pc = player.x + player.w/2;
    boss.facing = pc < c ? -1 : 1;

    switch (e.phase) {
      case 1: {  // 어질어질 + 뒤로 밀려남
        boss.x += (-boss.facing) * e.vx;
        e.vx *= 0.90;
        boss.x = clamp(boss.x, 20, W - boss.w - 20);
        e.timer++;
        if (e.timer >= 75) { e.phase = 2; e.timer = 0; }
        break;
      }
      case 2: {  // KFC 먹고 → 1차 포효 → 2차 포효 (얼굴 확대)
        e.timer++;
        const T = 150;
        if (e.timer < 28) e.p = e.timer / 28;             // 줌인
        else if (e.timer > T - 26) e.p = Math.max(0, (T - e.timer) / 26);  // 줌아웃
        else e.p = 1;
        if (e.timer === 52) {                 // 다 먹고 1차 포효
          boss.roar = true; e.shake = 18;
          spawnParticles(c, boss.y + 44, '#ffe08a', 28, 10);
        }
        if (e.timer === 84) boss.roar = false;            // 잠깐 숨 고르고
        if (e.timer === 98) {                 // 2차 포효
          boss.roar = true; e.shake = 22;
          spawnParticles(c, boss.y + 44, '#ffe08a', 34, 12);
        }
        if (e.timer >= T) { e.phase = 3; e.timer = 0; boss.roar = false; e.p = 0; }
        break;
      }
      case 3: {  // 던지는 모션 후, 연출이 끝나며 2배 트름 3발 발사
        if (Math.abs(pc - c) > 150) boss.x += boss.facing * 1.0;
        boss.x = clamp(boss.x, 20, W - boss.w - 20);
        e.timer++;
        if (e.timer >= 50) {
          player.invuln = 45;                 // 복귀 직후 잠깐 보호
          enrage = null; state = 'PLAY';
          boss.state = 'approach'; boss.timer = 50;
          // 연출 종료와 함께 큰 트름 3발이 부채꼴로 날아감 (PLAY 상태에서 이동)
          fireBurp(19, -0.18); fireBurp(19, 0); fireBurp(19, 0.18);
        }
        break;
      }
    }
    updateBurps();
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; }
    particles = particles.filter(p => p.life > 0);
  }

  function drawStar(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI/2 + i * (Math.PI*2/5);
      const a2 = a + Math.PI/5;
      ctx.lineTo(x + Math.cos(a)*r, y + Math.sin(a)*r);
      ctx.lineTo(x + Math.cos(a2)*r*0.45, y + Math.sin(a2)*r*0.45);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawKFC(x, y, dir) {
    // 양동이
    ctx.fillStyle = '#e23b3b';
    ctx.fillRect(x - 16, y, 32, 26);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x - 16, y + 6, 32, 6);
    ctx.fillStyle = '#e23b3b';
    ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('KFC', x, y + 23);
    // 치킨 다리 (드럼스틱)
    ctx.fillStyle = '#c98a3a';
    ctx.fillRect(x - 4, y - 14, 8, 18);
    ctx.beginPath(); ctx.arc(x, y - 14, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f2f2f2';
    ctx.fillRect(x - 2, y + 2, 4, 6);   // 뼈
    ctx.textAlign = 'left';
  }

  function drawEnrage() {
    if (!enrage) return;
    ctx.save();
    const sh = enrage.shake;
    if (sh > 0) ctx.translate((Math.random()-0.5)*sh, (Math.random()-0.5)*sh);
    // 페이즈 전환 확대 (얼굴 포커스)
    const p = enrage.p || 0;
    const s = 1 + 1.6 * p;
    const fxw = boss.x + boss.w/2, fyw = boss.y + 40;
    ctx.translate(lerp(fxw, W*0.6, p), lerp(fyw, H*0.45, p));
    ctx.scale(s, s);
    ctx.translate(-fxw, -fyw);
    drawBackground();
    drawProjectiles();
    drawBoss();
    drawPlayer();
    const cx = boss.x + boss.w/2;
    // 1단계: 어질어질 별
    if (enrage.phase === 1) {
      for (let i = 0; i < 3; i++) {
        const a = frame * 0.16 + i * (Math.PI*2/3);
        drawStar(cx + Math.cos(a)*24, boss.y + 2 + Math.sin(a)*7, 6, '#ffe14a');
      }
    }
    // 2단계: KFC 먹기
    if (enrage.phase === 2 && enrage.timer < 52) {
      drawKFC(cx + boss.facing * 30, boss.y + 30, boss.facing);
    }
    // 포효 방사선
    if (boss.roar) {
      ctx.strokeStyle = `rgba(255,220,140,${0.25 + 0.2*Math.abs(Math.sin(frame*0.5))})`;
      ctx.lineWidth = 3;
      for (let i = 0; i < 10; i++) {
        const ang = (i / 10) * Math.PI * 2 + frame * 0.04;
        const r1 = 46, r2 = 46 + 22 + 8*Math.sin(frame*0.4 + i);
        ctx.beginPath();
        ctx.moveTo(fxw + Math.cos(ang)*r1, fyw + Math.sin(ang)*r1);
        ctx.lineTo(fxw + Math.cos(ang)*r2, fyw + Math.sin(ang)*r2);
        ctx.stroke();
      }
    }
    ctx.restore();

    // 분노 배너
    if (enrage.phase >= 2) {
      ctx.globalAlpha = 0.85;
      ctx.textAlign = 'center';
      ctx.save();
      ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 20;
      ctx.fillStyle = '#ff6b3d';
      ctx.font = 'bold 40px "Trebuchet MS", sans-serif';
      ctx.fillText('KFC??', W/2, 110);
      ctx.restore();
      ctx.globalAlpha = 1;
      ctx.textAlign = 'left';
    }
  }

  // ---------- 보스 사망 연출 ----------
  function startBossDie() {
    if (state === 'BOSSDIE') return;
    burps = []; fartZones = []; laser = null;
    player.castTimer = 0; player.stunTimer = 0;     // 시전/경직 해제 → 자유 이동
    boss.flash = 0; boss.roar = false; boss.swingTimer = 0;
    const dir = (boss.x + boss.w/2 < player.x + player.w/2) ? -1 : 1;  // 플레이어 반대로
    die = { timer: 0, vx: dir * 15, vy: -11, rot: 0, angVel: dir * 0.26, shake: 22 };
    spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, '#ffd24a', 24, 9);
    state = 'BOSSDIE';
  }

  function updateBossDie() {
    const d = die;
    d.timer++;
    if (d.shake > 0.5) d.shake *= 0.88; else d.shake = 0;
    d.vy += GRAV * 1.1;
    boss.x += d.vx;
    boss.y += d.vy;
    d.rot += d.angVel;
    // 바닥에서 구르기 (튕김 + 마찰)
    if (boss.y >= GROUND_Y - boss.h) {
      boss.y = GROUND_Y - boss.h;
      if (d.vy > 2.5) d.vy *= -0.45; else d.vy = 0;
      d.vx *= 0.9; d.angVel *= 0.92;
      if (d.timer % 3 === 0) spawnParticles(boss.x + boss.w/2, GROUND_Y - 6, '#cdbb98', 5, 5);
    }
    boss.x = clamp(boss.x, 30, W - boss.w - 30);
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; }
    particles = particles.filter(p => p.life > 0);
    if (d.timer >= 180) {                                 // 3초 뒤
      die = null;
      startUpgrade();                                       // 강화 선택 후 다음 단계
    }
  }

  function drawBossDie() {
    if (!die) return;
    ctx.save();
    if (die.shake > 0) ctx.translate((Math.random()-0.5)*die.shake, (Math.random()-0.5)*die.shake);
    drawBackground();
    drawProjectiles();
    // 보스를 굴리며 그림
    ctx.save();
    const ccx = boss.x + boss.w/2, ccy = boss.y + boss.h/2;
    ctx.translate(ccx, ccy); ctx.rotate(die.rot); ctx.translate(-ccx, -ccy);
    drawBoss();
    ctx.restore();
    drawPlayer();
    ctx.restore();
  }

  // ========== 스테이지 2 : 음악 작업실 / skirr boi ==========
  const SKIRR_TEXT = '비상탈출구가있어마치윙맨타고있어입양하세요날타펫넌너무틀딱이야마치네이버카페';

  function platTop(i) {
    const pf = platforms[i];
    return { x: pf.x + pf.w/2 - boss.w/2, y: pf.y - boss.h };
  }
  function patrolTime() {
    if (boss.revived) return Math.floor(rand(30, 90));     // 3페: 0.5~1.5초
    return Math.floor(rand(60, boss.phase2 ? 120 : 180));  // 1페: 1~3초 / 2페: 1~2초
  }
  function startVanish(sonic) { boss.state = 'vanish'; boss.vanishSonic = sonic; boss.scale = 1; }
  function doP1Step() { boss.p1count--; startVanish(true); }
  function startPattern1() { boss.p1count = 3; doP1Step(); }
  function startPattern2() { boss.state = 'p2_windup'; boss.timer = 0; boss.micScale = 1; }
  function startPattern3() {
    boss.pants = true; boss.plat = 1;
    const t = platTop(1); boss.x = t.x; boss.y = t.y;
    spawnParticles(boss.x+boss.w/2, boss.y+boss.h/2, '#b9a0ff', 14, 6);
    boss.state = 'p3_wait'; boss.timer = 60;
  }
  function startPattern4() { boss.state = 'p4_windup'; boss.timer = 0; boss.burn = 0; }
  function throwMic() {
    const bx = boss.x + boss.w/2, by = boss.y + 40;
    let dx = (player.x + player.w/2) - bx, dy = (player.y + player.h/2) - by;
    const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    // 플레이어 방향으로 맵 끝(테두리)까지
    let tmax = Infinity;
    if (dx > 0) tmax = Math.min(tmax, (W - bx) / dx); else if (dx < 0) tmax = Math.min(tmax, -bx / dx);
    if (dy > 0) tmax = Math.min(tmax, (H - by) / dy); else if (dy < 0) tmax = Math.min(tmax, -by / dy);
    if (!isFinite(tmax)) tmax = W;
    micProjs.push({ tx: bx + dx*tmax, ty: by + dy*tmax, leg: 'out', u: 0, s: 0, size: 0.7, rot: 0 });
    shakeAmt = Math.max(shakeAmt, 8);
  }
  function sonicWave() {
    waves.push({ x: boss.x+boss.w/2, y: boss.y+boss.h/2, r: 12, maxR: 270, hit: false });
    shakeAmt = Math.max(shakeAmt, 11);
  }
  function fireLyricBullet(angOff) {
    const mx = boss.x + boss.w/2, my = boss.y + 34;
    const ang = Math.atan2((player.y+player.h/2) - my, (player.x+player.w/2) - mx) + (angOff || 0);
    const ch = SKIRR_TEXT[Math.floor(rand(0, SKIRR_TEXT.length))];
    bullets.push({ ch, x: mx, y: my, vx: Math.cos(ang)*9.5, vy: Math.sin(ang)*9.5, life: 130 });
  }
  function spawnNeonWall(pcx) {
    // 플레이어 바로 밑이 중심. 가운데→양옆으로 한 줄씩 퍼지며 상승
    neonWall = { cx: clamp(pcx, 24, W-24) - 21, step: 0, timer: 0 };
  }

  function updateSkirr() {
    boss.facing = (player.x + player.w/2 < boss.x + boss.w/2) ? -1 : 1;
    if (boss.flash > 0) boss.flash--;
    switch (boss.state) {
      case 'stand': {
        boss.timer--;
        if (boss.timer <= 0) {
          if (boss.p1count > 0) { doP1Step(); }
          else if (boss.patrolCount >= 2) {        // 순행 2회마다 패턴
            boss.patrolCount = 0;
            const r = Math.floor(rand(0, 3));
            if (boss.phase2) {                     // 2페: 패턴2 대신 패턴4
              if (r === 0) startPattern1();
              else if (r === 1) startPattern3();
              else startPattern4();
            } else {
              if (r === 0) startPattern1();
              else if (r === 1) startPattern2();
              else startPattern3();
            }
          } else {
            boss.patrolCount++;
            startVanish(false);
          }
        }
        break;
      }
      case 'vanish': {                 // 작아지며 사라짐

        }

        if (boss.timer === 32) boss.micScale = 2.2;
        if (boss.timer === 48) boss.micScale = 2.9;

        break;
      }
      case 'p4_windup': {              // 몸이 아래서부터 불타오름
        boss.timer++;

        if (boss.sub >= 4 && micProjs.length === 0) { boss.burn = 0; boss.state = 'stand'; boss.timer = patrolTime(); }
        break;
      }
    }
  }

  function drawBossSkirr(showMic) {
    const b = boss;
    const mic = (showMic === undefined) ? true : showMic;
    const cx = b.x + b.w/2;
    const top = b.y + Math.sin(b.bob) * 3;
    const sc = (b.scale === undefined) ? 1 : b.scale;

    if (glitch) ctx.translate((Math.random()-0.5)*6, 0);   // 지직 흔들림
    // 부활 아우라
    if (b.aura) {

      ag.addColorStop(0, `rgba(255,110,40,${pulse})`);

    ctx.beginPath(); ctx.arc(cx, top+30, 26, 0, Math.PI*2); ctx.fill();
    // 얼굴
    ctx.fillStyle = b.flash > 0 ? '#fff' : '#ffd0a8';
    ctx.beginPath(); ctx.arc(cx, top+30, 18, 0, Math.PI*2); ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#16131f'; ctx.stroke();
    ctx.fillStyle = '#1b2030';
    ctx.fillRect(cx + (b.facing<0 ? -10 : 4), top+26, 7, 5);

      ctx.fillRect(b.x-2, top+b.h-34, b.w+4, 30);

      ctx.fillStyle = '#fff'; ctx.font = 'bold 8px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('JURASSIC', cx, top+b.h-15); ctx.textAlign = 'left';
    }

      ctx.strokeStyle = '#222'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(cx, top+54); ctx.lineTo(mx, top+34); ctx.stroke();
      ctx.fillStyle = '#999'; ctx.beginPath(); ctx.arc(mx, top+30, 7*ms, 0, Math.PI*2); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#333'; ctx.stroke();

    }

      const fh = b.burn * b.h;
      const fy = top + b.h - fh;

        ctx.fillStyle = 'rgba(255,91,43,0.7)';
        ctx.fillRect(b.x+i, fy, 7, fh);
      }
    }

      e.p = Math.min(0.35, e.p + 0.01);  // 살짝 줌인
      if (e.hsY > H + 30) { e.phase = 2; e.timer = 0; }
    } else if (e.phase === 2) {          // 차징 (불 모임 + 떨림 고조)
      e.timer++;
      e.p = Math.min(0.7, e.p + 0.012);
      boss.burn = Math.min(1, e.timer / 55);
      e.shake = Math.max(e.shake, 2 + e.timer * 0.18);
      if (e.timer % 3 === 0) spawnParticles(boss.x + boss.w/2 + rand(-26,26), DANGER_Y, '#ff7b2b', 3, rand(4,9));
      if (e.timer >= 58) {               // 폭발!

        e.white = 14; e.ring = 12; e.shake = 30;
        boss.flash = 8; boss.burn = 1;
        spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, '#ffd24a', 30, 11);
        spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, '#ff5b2b', 26, 9);
      }
    } else {                             // 활성화 → 경기 재개
      e.timer++; e.bannerT++;
      if (e.timer % 4 === 0) spawnParticles(boss.x + boss.w/2 + rand(-20,20), boss.y + boss.h, '#ff9a3d', 4, 6);
      if (e.timer >= 64) {
        boss.flash = 0; boss.burn = 0;
        skirrRage = null; state = 'PLAY';
        boss.state = 'stand'; boss.timer = 70; boss.patrolCount = 0;
        player.invuln = 40; hitStop = 0;
      }
    }
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; }
    particles = particles.filter(p => p.life > 0);
  }
  function drawSkirrRage() {
    if (!skirrRage) return;
    const e = skirrRage;
    ctx.save();
    if (e.shake > 0) ctx.translate((Math.random()-0.5)*e.shake, (Math.random()-0.5)*e.shake);
    // 보스로 줌인
    const p = e.p || 0, sc = 1 + 0.9 * p;
    const fxw = boss.x + boss.w/2, fyw = boss.y + boss.h*0.45;
    ctx.translate(lerp(fxw, W*0.5, p), lerp(fyw, H*0.5, p));
    ctx.scale(sc, sc); ctx.translate(-fxw, -fyw);
    drawStudioBackground();
    // 차징 중 화면 어두워짐
    if (e.phase === 2) { ctx.fillStyle = `rgba(10,4,0,${0.5 * (e.timer/58)})`; ctx.fillRect(-200, -200, W+400, H+400); }
    drawBossSkirr(false);
    drawPlayer();
    drawProjectiles();
    // 충격파 링
    if (e.ring > 0) {
      const a = clamp(1 - e.ring / 520, 0, 1);
      ctx.globalAlpha = a;
      ctx.lineWidth = 10; ctx.strokeStyle = '#ffd24a';
      ctx.beginPath(); ctx.arc(fxw, fyw, e.ring, 0, Math.PI*2); ctx.stroke();
      ctx.lineWidth = 4; ctx.strokeStyle = '#fff';
      ctx.beginPath(); ctx.arc(fxw, fyw, e.ring, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // 날아가 떨어지는 헤드셋
    if (e.phase === 1) {
      ctx.save(); ctx.translate(e.hsX, e.hsY); ctx.rotate(e.hsRot);
      ctx.strokeStyle = '#111'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(0, 0, 16, Math.PI*1.04, Math.PI*1.96); ctx.stroke();
      ctx.fillStyle = '#e23b3b';
      ctx.fillRect(-20, -4, 7, 12); ctx.fillRect(13, -4, 7, 12);
      ctx.restore();
    }
    ctx.restore();

    // 화면 전체 백색 플래시
    if (e.white > 0) { ctx.globalAlpha = (e.white / 14) * 0.85; ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H); ctx.globalAlpha = 1; }
    // 불 비네트
    if (e.phase >= 2) {
      const vg = ctx.createRadialGradient(W/2, H/2, H*0.25, W/2, H/2, W*0.62);
      vg.addColorStop(0, 'rgba(255,80,20,0)');
      vg.addColorStop(1, `rgba(255,60,10,${e.phase===3?0.4:0.25})`);
      ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
    }
    // 배너 슬램 (불꽃숭이 activate)
    if (e.bannerT >= 0) {
      const t = e.bannerT;
      const punch = 1 + Math.max(0, (1 - t/9)) * 1.4;   // 크게 → 정상
      const jit = t < 9 ? (Math.random()-0.5) * 6 : 0;
      ctx.save();
      ctx.translate(W/2 + jit, 116);
      ctx.scale(punch, punch);
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ff2b00'; ctx.shadowBlur = 26;
      ctx.lineWidth = 6; ctx.strokeStyle = '#5a1500';
      ctx.font = 'bold 54px "Trebuchet MS", sans-serif';
      ctx.strokeText('불꽃숭이 activate', 0, 0);
      const grd = ctx.createLinearGradient(0, -30, 0, 20);
      grd.addColorStop(0, '#ffe08a'); grd.addColorStop(1, '#ff5b2b');
      ctx.fillStyle = grd;
      ctx.fillText('불꽃숭이 activate', 0, 0);
      ctx.restore();
      ctx.textAlign = 'left';
    }
  }

  // ---------- skirr 3페이즈(부활) 연출 ----------
  function startSkirrRevive() {
    if (state === 'SKIRRREVIVE') return;
    boss.revived = true;
    boss.hp = Math.max(boss.hp, 1);
    waves = []; bullets = []; neonSquares = []; neonWall = null; micProjs = []; redBlocks = []; pShots = []; floatTexts = [];
    boss.state = 'revive'; boss.burn = 0; boss.scale = 1; boss.micScale = 1; boss.pants = false; boss.p1count = 0; boss.flash = 0;
    player.castTimer = 0; laser = null;
    const dir = (boss.x + boss.w/2 < player.x + player.w/2) ? -1 : 1;   // 플레이어 반대로 나자빠짐
    skirrRevive = { phase: 1, timer: 0, shake: 24, dogX: W + 90, dogY: 70, aura: 0, white: 0, ring: 0, bannerT: -1,
                    vx: dir*14, vy: -10, rot: 0, av: dir*0.3, landed: false, restRot: dir*1.5 };
    spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, '#ff7676', 20, 9);
    state = 'SKIRRREVIVE';
  }
  function reviveRestY() {              // 보스가 나자빠져 멈출 바닥(플랫폼 또는 위험바닥)
    let restY = DANGER_Y;
    const cx = boss.x + boss.w/2;
    for (const pf of platforms) {
      if (cx > pf.x && cx < pf.x + pf.w && pf.y >= boss.y) restY = Math.min(restY, pf.y);
    }
    return restY;
  }
  function updateSkirrRevive() {
    const e = skirrRevive;
    if (e.shake > 0.5) e.shake *= 0.9; else e.shake = 0;
    if (e.white > 0) e.white--;
    if (e.ring > 0) e.ring += 13;

    if (e.phase === 1) {                 // ssunang처럼 나자빠짐 → 2초 대기
      e.timer++;
      if (!e.landed) {
        e.vy += GRAV * 1.1;
        boss.x += e.vx; boss.y += e.vy; e.rot += e.av;
        e.vx *= 0.99;
        boss.x = clamp(boss.x, 20, W - boss.w - 20);
        const restY = reviveRestY();
        if (e.vy > 0 && boss.y + boss.h >= restY) {
          boss.y = restY - boss.h;
          if (e.vy > 3) { e.vy *= -0.42; e.vx *= 0.8; e.av *= 0.7; spawnParticles(boss.x+boss.w/2, restY-4, '#aab0cc', 6, 5); }
          else { e.vy = 0; e.landed = true; }
        }
      } else {
        e.rot += (e.restRot - e.rot) * 0.15;   // 누운 자세로 정착
      }
      if (e.timer >= 120) { e.phase = 2; e.timer = 0; e.dogX = W + 90; e.dogY = 70; }  // 2초 뒤 강아지 등장
    } else if (e.phase === 2) {          // 강아지가 와서 치유 — 아우라 차오름
      e.timer++;
      const tx = boss.x + boss.w/2, ty = boss.y;
      e.dogX += (tx - e.dogX) * 0.08; e.dogY += (ty - e.dogY) * 0.08;
      e.rot += (e.restRot - e.rot) * 0.15;
      if (Math.abs(e.dogX - tx) < 20) e.aura = Math.min(1, e.aura + 1/60);
      if (e.aura > 0 && e.timer % 3 === 0) spawnParticles(boss.x + boss.w/2, boss.y + rand(0,boss.h), '#ffcaa0', 2, 3);
      e.rot *= (e.aura > 0.3 ? 0.85 : 1);     // 아우라 차면 일어남
      if (e.aura >= 1) {                       // 부활 폭발
        e.phase = 3; e.timer = 0; e.bannerT = 0;
        e.white = 14; e.ring = 14; e.shake = 30; e.rot = 0;
        boss.aura = true; boss.hp = 120;
        const ry = reviveRestY(); boss.y = ry - boss.h;
        spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, '#ffd24a', 34, 12);
        spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, '#ff7b2b', 26, 9);
      }
    } else {                             // 부활 → 경기 재개
      e.timer++; e.bannerT++;
      e.dogX += 9; e.dogY -= 5;          // 강아지 떠남
      if (e.timer >= 60) {
        skirrRevive = null; state = 'PLAY';
        boss.state = 'stand'; boss.timer = 50; boss.patrolCount = 0;
        player.invuln = 40; hitStop = 0;
      }
    }
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; }
    particles = particles.filter(p => p.life > 0);
  }
  function drawSkirrRevive() {

      ctx.strokeText('why he revive?', 0, 0);
      const grd = ctx.createLinearGradient(0, -28, 0, 18);
      grd.addColorStop(0, '#fff2a8'); grd.addColorStop(1, '#ff7b2b');

  // ========== 스테이지 3 : Hansubal (Master of noise) ==========
  const PATTERN3 = '* * **  *  *** ** ********';

  // ----- Hansubal AI -----
  function hPlatTop(i) { return platforms[i].y - boss.h; }
  // 2페이즈 4분할 발판 시계방향 순서: 좌상(0)→우상(1)→우하(3)→좌하(2)→좌상(0)
  const CW_NEXT = [1, 3, 0, 2];
  function hNextPlat() {
    if (boss.phase2 && platforms.length === 4) {
      boss.platIdx = CW_NEXT[boss.platIdx];
      const pf = platforms[boss.platIdx];
      boss.y = pf.y - boss.h;
      boss.x = pf.x;            // 항상 왼쪽 끝에서 시작
      boss.dir = 1;            // 항상 오른쪽으로 이동
      spawnParticles(boss.x + boss.w/2, boss.y + boss.h, '#7fe3ff', 8, 5);
      shakeAmt = Math.max(shakeAmt, 4);
      return;
    }
    boss.platIdx = (boss.platIdx + 1) % platforms.length;
    const pf = platforms[boss.platIdx];
    boss.y = pf.y - boss.h;
    boss.x = clamp(boss.x, pf.x, pf.x + pf.w - boss.w);
    boss.dir *= -1;
    spawnParticles(boss.x + boss.w/2, boss.y + boss.h, '#9be84a', 8, 5);
    shakeAmt = Math.max(shakeAmt, 4);
  }
  function hPickPattern() {
    const r = Math.floor(rand(0, 3));
    if (r === 0) {
      if (boss.phase2) { boss.state = 'laugh_place'; boss.sub = 0; boss.subTimer = 16; hanMines = []; boss.dir = 1; }
      else { boss.state = 'laugh_windup'; boss.timer = 28; }
    }
    else if (r === 1) { boss.state = 'p2_windup'; boss.timer = 26; }
    else { boss.state = 'p3_windup'; boss.timer = 32; }
  }
  function fireHahak(intensity) {
    const mx = boss.x + boss.w/2, my = boss.y + 30;
    const base = Math.atan2((player.y+player.h/2) - my, (player.x+player.w/2) - mx);
    for (let k = 0; k <= intensity; k++) {
      const ang = base + rand(-0.45, 0.45);
      const sp = 2.4 + intensity * 1.05;     // 속도↓
      laughs.push({ x: mx, y: my, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp, life: 150, size: 10 + intensity*2.5 });  // 크기↓
    }
  }
  function fireNote() {
    const mx = boss.x + boss.w/2, my = boss.y + 40;
    const base = Math.atan2((player.y+player.h/2) - my, (player.x+player.w/2) - mx);
    const ang = base + rand(-0.25, 0.25), sp = rand(3, 5);
    notes.push({ x: mx, y: my, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp, life: 160 });
  }
  function hMapAttack() {
    mapAtk = 16; shakeAmt = Math.max(shakeAmt, 28);
    waves.push({ x: W/2, y: H/2, r: 14, maxR: 1000, hit: false });
    damagePlayer();
  }
  function updateHansubal() {
    if (boss.flash > 0) boss.flash--;
    boss.bob += 0.08;
    boss.facing = (player.x+player.w/2 < boss.x+boss.w/2) ? -1 : 1;
    switch (boss.state) {
      case 'patrol': {                  // 발판 위아래 훑기
        const pf = platforms[boss.platIdx];
        boss.x += boss.dir * (boss.phase2 ? 3.4 : 2.4);
        if (boss.x <= pf.x) { boss.x = pf.x; hNextPlat(); }
        else if (boss.x + boss.w >= pf.x + pf.w) { boss.x = pf.x + pf.w - boss.w; hNextPlat(); }
        boss.timer--;
        if (boss.timer <= 0) hPickPattern();
        break;
      }
      case 'laugh_windup': {            // 준비동작: 숨 들이쉼
        boss.timer--;
        if (boss.timer % 6 === 0) spawnParticles(boss.x+boss.w/2, boss.y+30, '#ffd0a8', 2, 2);
        if (boss.timer <= 0) { boss.state = 'laugh'; boss.sub = 0; boss.subTimer = 8; boss.laughScale = 1; }
        break;
      }
      case 'p2_windup': {               // 준비동작: 파란 기운 모음
        boss.timer--;
        if (boss.timer % 5 === 0) spawnParticles(boss.x+boss.w/2, boss.y+40, '#5b8cff', 2, 3);
        if (boss.timer <= 0) boss.state = 'p2_move';
        break;
      }
      case 'p3_windup': {               // 준비동작: 나뭇잎이 모임
        boss.timer--;
        if (boss.timer % 4 === 0) spawnParticles(boss.x+boss.w/2 + rand(-30,30), boss.y+rand(0,boss.h), '#2e8b57', 2, 3);
        if (boss.timer <= 0) { boss.state = 'p3_notes'; boss.tree = true; boss.timer = 180; boss.subTimer = 0; }
        break;
      }
      case 'laugh': {                   // 작게 → 4번 크게, 웃을 때마다 하학!
        boss.subTimer--;
        if (boss.subTimer <= 0 && boss.sub < 5) {
          const intensity = boss.sub;   // 0 작게, 1~4 점점 크게
          fireHahak(intensity);
          boss.laughScale = 1 + intensity * 0.22;
          boss.sub++;
          boss.subTimer = (boss.sub === 1) ? 50 : 42;   // 웃음 사이 간격
          shakeAmt = Math.max(shakeAmt, 3 + intensity*3);
        }
        if (boss.sub >= 5 && boss.subTimer <= -18) { boss.laughScale = 1; boss.state = 'patrol'; boss.timer = 120; }
        break;
      }
      case 'p2_move': {                 // 윗 발판 가운데로
        boss.platIdx = 0;
        const tx = platforms[0].x + platforms[0].w/2 - boss.w/2, ty = hPlatTop(0);
        boss.x += (tx - boss.x) * 0.12; boss.y += (ty - boss.y) * 0.2;
        if (Math.abs(tx - boss.x) < 6) {
          boss.x = tx; boss.y = ty;
          boss.state = 'p2_check'; boss.timer = 402; boss.dmgHp = boss.hp; boss.watch = true;
          popText(boss.x + boss.w/2, boss.y - 16, '67?', '#5b8cff');
        }
        break;
      }
      case 'p2_check': {                // 6.7초 내 67 데미지 못 주면 맵 전체공격
        boss.timer--;
        // 1초마다 플레이어 위치에 경고 → 1초 뒤 67시계 폭발
        if (boss.timer > 30 && boss.timer % 60 === 0) {
          clockWarns.push({ x: player.x + player.w/2, y: player.y + player.h/2, timer: 60, hit: false });
        }
        if (boss.dmgHp - boss.hp >= 67) { boss.watch = false; clockWarns = []; popText(boss.x+boss.w/2, boss.y-16, 'OK!', '#9be84a'); boss.state = 'patrol'; boss.timer = 100; }
        else if (boss.timer <= 0) { boss.watch = false; clockWarns = []; hMapAttack(); boss.state = 'patrol'; boss.timer = 150; }
        break;
      }
      case 'p3_notes': {                // 나무 변신, 천천히 접근 + 음표 발사 (3초)
        boss.tree = true;
        const dir = (player.x+player.w/2 < boss.x+boss.w/2) ? -1 : 1;
        const pf = platforms[boss.platIdx];
        boss.x = clamp(boss.x + dir*0.8, pf.x, pf.x + pf.w - boss.w);
        boss.subTimer--;
        if (boss.subTimer <= 0) { fireNote(); boss.subTimer = boss.phase2 ? 20 : 28; }   // 발사량↓
        boss.timer--;
        if (boss.timer <= 0) {
          // 기 모으기 시작 시점에 조준 고정 (이후엔 추적 안 함 → 회피 가능)
          boss.laserAim = Math.atan2((player.y+player.h/2) - (boss.y+40), (player.x+player.w/2) - (boss.x+boss.w/2));
          boss.state = 'p3_charge'; boss.timer = 50;
        }
        break;
      }
      case 'p3_charge': {               // 레이저 전 기 모으기 (조준 고정)
        boss.timer--;
        if (boss.timer % 3 === 0) {
          const ang = rand(0, Math.PI*2), d = 72;
          particles.push({ x: boss.x+boss.w/2 + Math.cos(ang)*d, y: boss.y+40 + Math.sin(ang)*d, vx: -Math.cos(ang)*4.5, vy: -Math.sin(ang)*4.5, life: 18, color: '#ffe14a' });
        }
        shakeAmt = Math.max(shakeAmt, 4);
        if (boss.timer <= 0) {
          const laserLife = boss.phase2 ? 240 : 120;
          noteLaser = { x: boss.x+boss.w/2, y: boss.y+40, ang: boss.laserAim, life: laserLife, maxLife: laserLife, angVel: boss.phase2 ? (Math.PI*2/240) : 0, w: 14 };
          shakeAmt = Math.max(shakeAmt, 16);
          boss.state = 'p3_laser'; boss.timer = laserLife;
        }
        break;
      }
      case 'p3_laser': {                // 음표 레이저 (2페이즈: 회전+두꺼워짐)
        boss.timer--;
        if (noteLaser) {
          noteLaser.x = boss.x+boss.w/2; noteLaser.y = boss.y+40;
          if (boss.phase2) {
            noteLaser.ang += noteLaser.angVel || 0;
            noteLaser.w = 14 + (1 - noteLaser.life / noteLaser.maxLife) * 52;
          }
        }
        if (boss.timer <= 0) { noteLaser = null; boss.tree = false; boss.state = 'patrol'; boss.timer = 130; }
        break;
      }
      case 'laugh_place': {            // 2페이즈: 시계방향으로 걸으며 하학! 지뢰 설치
        const pf = platforms[boss.platIdx];
        boss.x += 4.2;                  // 왼→오른쪽 이동
        if (boss.x + boss.w >= pf.x + pf.w) hNextPlat();   // 우측 끝 도달 시 다음 발판(시계방향)
        boss.subTimer--;
        if (boss.subTimer <= 0 && boss.sub < 10) {
          hanMines.push({ x: boss.x + boss.w/2, y: boss.y + boss.h, life: 9999, pulse: 0 });
          spawnParticles(boss.x+boss.w/2, boss.y+boss.h, '#ff5b6e', 6, 5);
          popText(boss.x+boss.w/2, boss.y-10, '하학!', '#ff5b6e');

        }

        break;
      }
      case 'laugh_big': {              // 2페이즈: 지뢰가 1초간 플레이어를 추적 후 폭발
        boss.timer--;
        // timer 160→100: 1초간 플레이어를 향해 이동
        if (boss.timer > 100) {
          for (const m of hanMines) {
            const dx = (player.x+player.w/2) - m.x, dy = (player.y+player.h/2) - m.y;
            const d = Math.hypot(dx, dy) || 1;
            m.x += dx/d * 3.4; m.y += dy/d * 3.4;

        }
        if (boss.timer === 100) {       // 폭발
          shakeAmt = Math.max(shakeAmt, 28);
          for (const m of hanMines) {
            spawnParticles(m.x, m.y - 20, '#ff5b6e', 20, 10);

          }
          hanMines = [];
        }
        if (boss.timer <= 0) { boss.laughScale = 1; boss.state = 'patrol'; boss.timer = 140; }
        break;
      }
    }
    if (rectsOverlap(boss, player)) damagePlayer();   // 본체 접촉 피해
  }

  function updateIntro3() {
    const e = intro3;
    if (e.shake > 0.5) e.shake *= 0.9; else e.shake = 0;
    for (const s of e.sonics) s.r += s.spd;
    e.sonics = e.sonics.filter(s => s.r < s.maxR);
    switch (e.phase) {
      case 1: {  // 강한 음파가 맵을 뒤덮음 + 흔들림
        if (e.timer === 0) { e.sonics.push({ x: W/2, y: H/2, r: 12, maxR: 780, spd: 15 }); e.shake = 32; }
        e.timer++;
        if (e.timer >= 50) { e.phase = 2; e.timer = 0; e.beat = 0; e.beatTimer = 0; }
        break;
      }
      case 2: {  // 리듬(* * **  *  *** ** ********)에 맞춰 점점 많이
        e.beatTimer--;
        if (e.beatTimer <= 0 && e.beat < PATTERN3.length) {
          if (PATTERN3[e.beat] === '*') {
            e.sonics.push({ x: rand(90, W-90), y: rand(130, H-130), r: 8, maxR: rand(150, 260), spd: rand(7, 11) });
            e.shake = Math.max(e.shake, 9);
          }
          e.beat++; e.beatTimer = 9;
        }
        if (e.beat >= PATTERN3.length) { e.phase = 3; e.timer = 0; }
        break;
      }
      case 3: {  // 2층 가운데 착지
        e.timer++;
        boss.vy += 1.4; boss.y += boss.vy;
        if (boss.y >= 120) {
          boss.y = 120; boss.vy = 0;
          if (!e.landed) { e.landed = true; e.shake = 36; spawnParticles(boss.x+boss.w/2, 250, '#9be84a', 28, 10); }
        }
        if (e.landed && e.timer >= 40) { e.phase = 4; e.timer = 0; }
        break;
      }
      case 4: {  // 확대 + 타이틀
        e.timer++;
        e.p = Math.min(1, e.timer / 40);
        if (e.timer >= 150) { intro3 = null; state = 'PLAY'; boss.state = 'patrol'; boss.timer = 120; boss.platIdx = 0; boss.dir = -1; player.invuln = 40; hitStop = 0; }
        break;
      }
    }
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; }
    particles = particles.filter(p => p.life > 0);
  }

  // ---- 로직 1스텝 (항상 1/60초 분량, 기기 주사율과 무관) ----
  function stepGame() {
    frame++;
    // 컷씬 스킵: 스페이스 1초 홀드
    if (CUTSCENES.includes(state)) {
      if (keys[' '] || touchHeld.jump) { skipHold++; if (skipHold >= 60) { skipHold = 0; skipCutscene(); } }
      else skipHold = 0;
    } else skipHold = 0;
    // 화면 흔들림 감쇠 (고정 속도)
    if (shakeAmt > 0.5) shakeAmt *= 0.85; else shakeAmt = 0;

    if (state === 'MENU') {
      if (pressed['1']) controlScheme = 1;
      if (pressed['2']) controlScheme = 2;
      if (pressed['enter'] || pressed[' ']) startIntro();
      // 치트 코드: givegold
      for (const k of Object.keys(pressed)) {
        if (pressed[k] && k.length === 1 && k >= 'a' && k <= 'z') {
          cheatBuf = (cheatBuf + k).slice(-8);
          if (cheatBuf === 'givegold') {
            addGold(100000000);
            popText(W/2, H/2, '+100,000,000 GOLD!', '#FFD700');
            cheatBuf = '';
          }
        }
      }
    } else if (state === 'INTRO') {
      updateIntro();
      if (state === 'INTRO') updatePlayer(true);
    } else if (state === 'ENRAGE') {
      updateEnrage();
      if (state === 'ENRAGE') updatePlayer(true);
    } else if (state === 'BOSSDIE') {
      updateBossDie();
      if (state === 'BOSSDIE') updatePlayer(true);
    } else if (state === 'TRANSITION') {
      updateTransition();
    } else if (state === 'INTRO2') {
      updateIntro2();
      if (state === 'INTRO2') updatePlayer(true);
    } else if (state === 'SKIRRRAGE') {

        if (state === 'PLAY' && boss.type === 'ssun' && !boss.enraged && boss.hp <= 150 && boss.hp > 0) startEnrage();

      }

      for (const k of Object.keys(pressed)) {

          cheatBuf = (cheatBuf + k).slice(-4);
          if (cheatBuf.endsWith('sk') && boss && boss.hp > 0) {

            cheatBuf = '';
          }

      if (pressed['enter'] || pressed[' ']) state = 'MENU';   // 클리어/패배 → 메인화면
    }

  // ---- 그리기 (매 화면 프레임) ----

  // 모바일 온스크린 컨트롤 그리기
  function drawTouchControls() {
    ctx.save();

    // 십자 조이스틱
    const d = TC.dpad;
    ctx.fillStyle = 'rgba(20,22,30,0.32)'; ctx.beginPath(); ctx.arc(d.cx, d.cy, d.R, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 3;
    const arm = d.R*0.62, tw = 18;

    ctx.fillRect(d.cx-tw, d.cy-arm, tw*2, arm*2);

    if (touchHeld.left)  { ctx.beginPath(); ctx.moveTo(d.cx-arm, d.cy); ctx.lineTo(d.cx-arm+ar, d.cy-ar); ctx.lineTo(d.cx-arm+ar, d.cy+ar); ctx.fill(); }
    if (touchHeld.right) { ctx.beginPath(); ctx.moveTo(d.cx+arm, d.cy); ctx.lineTo(d.cx+arm-ar, d.cy-ar); ctx.lineTo(d.cx+arm-ar, d.cy+ar); ctx.fill(); }
    if (touchHeld.up)    { ctx.beginPath(); ctx.moveTo(d.cx, d.cy-arm); ctx.lineTo(d.cx-ar, d.cy-arm+ar); ctx.lineTo(d.cx+ar, d.cy-arm+ar); ctx.fill(); }
    if (touchHeld.down)  { ctx.beginPath(); ctx.moveTo(d.cx, d.cy+arm); ctx.lineTo(d.cx-ar, d.cy+arm-ar); ctx.lineTo(d.cx+ar, d.cy+arm-ar); ctx.fill(); }

      const b = TC[key];
      ctx.fillStyle = touchHeld[key] ? b.col : 'rgba(20,22,30,0.35)';

      ctx.fillText(b.label, b.cx, b.cy + b.r*0.18);

    ctx.textAlign = 'left';
    ctx.restore();
  }

  // ---------- 보스 클리어 강화 선택 ----------

  function wrapText(txt, cx, y, maxW, lh) {

  // ========== 스테이지 4 : 병현? ==========

    burps=[]; fartZones=[]; laser=null; particles=[]; floatTexts=[]; waves=[]; bullets=[]; neonSquares=[]; neonWall=null; micProjs=[]; redBlocks=[]; pShots=[];

  function startIntro4() { intro4 = { timer: 0, idx: 0, shake: 0 }; state = 'INTRO4'; }
  function updateIntro4() {

  // ----- 병현 졸개/분신 생성 -----
  function spawnByMinion(kind, hp, x) {
    const px = (x !== undefined) ? x : boss.x + boss.w/2;
    const dir = (player.x + player.w/2 < px) ? -1 : 1;
    const mhp = (kind === 'cheol') ? 10 : 20;   // 병순 20 · 병철 10
    byMinions.push({
      kind, x: px - 16, y: boss.y + 16, w: 32, h: 32,
      vx: dir * rand(2, 4), vy: -rand(11, 14),   // 위로 쏘아올림 → 포물선 착지
      hp: mhp, maxHp: mhp, grounded: false, shoot: 120, flash: 0,
    });
    spawnParticles(px, boss.y + 30, '#ffd24a', 8, 6);
    shakeAmt = Math.max(shakeAmt, 4);
  }
  function spawnByeongClones() {
    byClones = byClones.filter(c => c.active);   // 이미 활성화된 분신은 유지
    const labels = ['병헌', '병철', '병건'];
    const extra = boss.phase2 ? 2 : 0;           // lonely: 본체 제외 분신 2개 더
    const total = 4 + extra;                     // 본체 1 + 분신 (3+extra)
    const mainSlot = Math.floor(rand(0, total));
    let li = 0;
    for (let i = 0; i < total; i++) {
      const isMain = (i === mainSlot);
      const gx = 110 + i * ((W - 220) / (total - 1));               // 가로로 고르게
      const elevated = boss.phase2 && !isMain && (i % 2 === 1);     // 일부는 공중에 소환(본체 제외)
      const gy = elevated ? GROUND_Y - 110 - rand(120, 220) : GROUND_Y - 110;
      byClones.push({
        x: gx - 32, y: gy, w: 64, h: 110,
        name: isMain ? '병현' : labels[li++ % labels.length], isMain, active: false, hp: 30, maxHp: 30, flash: 0, vy: 0,
      });
    }
    shakeAmt = Math.max(shakeAmt, 16);
    spawnParticles(W/2, GROUND_Y - 60, '#c86fa0', 24, 9);
  }
  function fireByShot(x, y) {
    const ang = Math.atan2((player.y+player.h/2) - y, (player.x+player.w/2) - x);
    const sp = 5.5;   // 빨간 네모 정도의 탄속
    byShots.push({ x, y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp, life: 220 });
  }

  // ----- 병현 본체 AI -----
  function startByeongPattern() {
    const p = boss.patternIdx % 3;
    if (p === 0) { boss.state = 'p1_inflate'; boss.timer = 40; }
    else if (p === 1) { boss.state = 'p2_stretch'; boss.timer = 30; }
    else { boss.state = 'p3_inflate'; boss.timer = 40; }
  }
  function byeongEndPattern2(foundMain) {
    if (!foundMain) {
      const mc = byClones.find(c => c.isMain);
      if (mc) { boss.x = clamp(mc.x, 40, W - boss.w - 40); boss.y = GROUND_Y - boss.h; }
    }
    boss.visible = true;
    byClones = byClones.filter(c => c.active && !c.isMain);   // 비활성·본체분신 제거, 활성 분신은 졸개로 잔류
    boss.state = 'idle'; boss.timer = 150; boss.summonTimer = 180;
    boss.patternIdx = (boss.patternIdx + 1) % 3;
    shakeAmt = Math.max(shakeAmt, 12);
  }
  // ----- 병현 lonely(2페이즈) 연출 -----
  function startByeongLonely() {
    boss.phase2 = true;
    boss.visible = true; boss.x = clamp(W/2 - boss.w/2, 40, W - boss.w - 40); boss.y = GROUND_Y - boss.h;
    boss.state = 'idle'; boss.timer = 60; boss.summonTimer = 120; boss.squish = 1; boss.stretch = 1;
    byMinions = []; byClones = []; byShots = [];   // 홀로 남음
    byLonely = { timer: 0, shake: 20 };
    spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, '#7fa0ff', 24, 8);

  }
  function updateByeongLonely() {
    const e = byLonely;
    if (e.shake > 0.5) e.shake *= 0.92; else e.shake = 0;
    e.timer++;
    boss.bob += 0.08;
    if (e.timer >= 140) { byLonely = null; state = 'PLAY'; player.invuln = 30; hitStop = 0; }
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; }

  function drawByeongLonely() {
    ctx.save();
    if (byLonely && byLonely.shake > 0) ctx.translate((Math.random()-0.5)*byLonely.shake, (Math.random()-0.5)*byLonely.shake);

  function updateByeong() {
    if (boss.flash > 0) boss.flash--;
    boss.bob += 0.08;
    boss.facing = (player.x + player.w/2 < boss.x + boss.w/2) ? -1 : 1;
    // 체력 100 깎일 때마다 병순 & 병철 하나씩 소환
    while (boss.hp > 0 && boss.hp <= boss.nextSummonHp && boss.nextSummonHp > 0) {
      const sx = boss.visible !== false ? boss.x + boss.w/2 : rand(120, W-120);
      spawnByMinion('sun', 30, sx - 18); spawnByMinion('cheol', 30, sx + 18);
      boss.nextSummonHp -= 100;
    }
    // 600 이하 → lonely 강화 연출 (1회)
    if (!boss.phase2 && boss.hp <= 600 && boss.hp > 0) { startByeongLonely(); return; }
    switch (boss.state) {
      case 'idle': {
        const dir = (boss.x + boss.w/2 < player.x + player.w/2) ? -1 : 1;   // 플레이어 반대로 느리게
        boss.x += dir * 1.0; boss.x = clamp(boss.x, 40, W - boss.w - 40);
        boss.summonTimer--;
        if (boss.summonTimer <= 0) { spawnByMinion('sun', 30); boss.summonTimer = 180; }   // 3초마다 병순
        boss.timer--;
        if (boss.timer <= 0) startByeongPattern();
        break;
      }
      case 'p1_inflate': case 'p3_inflate': {
        boss.timer--; boss.squish = 1 + (1 - boss.timer/40) * 0.6;   // 몸을 부풀림
        if (boss.timer <= 0) { boss.state = (boss.state === 'p1_inflate') ? 'p1_deflate' : 'p3_deflate'; boss.timer = 30; }
        break;
      }
      case 'p1_deflate': case 'p3_deflate': {
        boss.timer--; boss.squish = 1.6 - (1 - boss.timer/30) * 0.6;   // 바람빠지듯 쪼그라듦
        if (boss.timer <= 0) {
          boss.squish = 1;
          const isP3 = (boss.state === 'p3_deflate');
          const cnt = boss.phase2 ? 6 : 3;   // lonely 강화 시 2배
          for (let i = 0; i < cnt; i++) spawnByMinion(isP3 ? 'cheol' : 'sun', isP3 ? 30 : 50, boss.x + boss.w/2 + (i - (cnt-1)/2)*28);
          boss.state = 'idle'; boss.timer = 150; boss.summonTimer = 180;
          boss.patternIdx = (boss.patternIdx + 1) % 3;
        }
        break;
      }
      case 'p2_stretch': {
        boss.timer--; boss.stretch = 1 + (1 - boss.timer/30) * 1.6;   // 가로로 늘어짐
        if (boss.timer <= 0) { boss.visible = false; boss.x = -9999; boss.stretch = 1; boss.state = 'p2_hidden'; boss.timer = 60; }
        break;
      }
      case 'p2_hidden': {
        boss.timer--;
        if (boss.timer <= 0) { spawnByeongClones(); boss.state = 'p2_clones'; boss.timer = 180; }   // 1초 후 분신과 등장, 3초 제한
        break;
      }
      case 'p2_clones': {
        boss.timer--;
        if (boss.timer <= 0) { for (const c of byClones) if (!c.isMain) c.active = true; byeongEndPattern2(false); }   // 3초 내 본체 못 찾음
        break;
      }
    }
  }

  // ----- 플레이어 공격 히트박스 헬퍼 -----
  function playerMeleeRect() {
    if (player.meleeTimer <= 0) return null;
    const cx = player.x + player.w/2;
    const R = 88 * (player.rangeMul || 1), UD = 80 * (player.rangeMul || 1);
    if (player.meleeDir === 'up') return { x: cx-(player.w+40)/2, y: player.y+8-UD, w: player.w+40, h: UD };
    if (player.meleeDir === 'down') return { x: cx-(player.w+40)/2, y: player.y+player.h-8, w: player.w+40, h: UD };
    return { x: player.facing>0 ? player.x+player.w : player.x-R, y: player.y+8, w: R, h: player.h-16 };
  }
  function laserBeamRect() {
    if (!laser) return null;
    return { x: laser.dir>0 ? player.x+player.w : 0, y: laser.y, w: laser.dir>0 ? W-(player.x+player.w) : player.x, h: laser.h };
  }
  // 근접 타격 반동(넉백/포고) — 졸개·분신 타격에도 적용
  function byeongMeleeReact() {
    player.meleeHit = true; hitStop = 3; player.sx = 0.8; player.sy = 1.2;
    if (player.meleeDir === 'down') player.vy = -8;                         // 포고(아래공격 시 위로 튕김)
    else if (player.meleeDir === 'up') player.vy = Math.max(player.vy, 4);  // 위공격 시 아래로
    else player.kbx = -player.facing * 4.5;                                 // 옆공격 넉백
  }
  // 엉덩방아(슬램) 착지 광역 피해 — 졸개·분신
  function byeongSlamHit(hb, dmg) {
    for (const m of byMinions) {
      if (rectsOverlap(hb, m)) { m.hp -= dmg; m.flash = 6; spawnParticles(m.x+m.w/2, m.y+m.h/2, '#ff9a3d', 8, 6); }
    }
    byMinions = byMinions.filter(m => m.hp > 0);
    for (const c of byClones) {
      if (!rectsOverlap(hb, c)) continue;
      c.flash = 6; spawnParticles(c.x+c.w/2, c.y+c.h/2, '#ff9a3d', 8, 6);
      if (c.isMain) {
        boss.x = clamp(c.x, 40, W - boss.w - 40); boss.y = GROUND_Y - boss.h; boss.visible = true;
        damageBoss(dmg);
        if (state !== 'PLAY') return;
        byeongEndPattern2(true);
        return;
      } else {
        if (!c.active) c.active = true;
        c.hp -= dmg;
      }
    }
    byClones = byClones.filter(c => !(c.active && c.hp <= 0));
  }
  function applyPlayerHitsToByeong() {
    const mrect = (!player.meleeHit) ? playerMeleeRect() : null;
    const lrect = laserBeamRect();
    const dashing = player.dashTimer > 0 && player.dashDmg > 0;
    const LASER_DMG = 1.5;   // 레이저 프레임당 피해
    // 졸개 피해 (특수게이지 안 오름)
    for (const m of byMinions) {
      let dmg = 0, consume = false;
      if (mrect && rectsOverlap(mrect, m)) { dmg += player.meleeDmg; consume = true; }
      if (dashing && m.dashHitId !== player.dashId && rectsOverlap(player, m)) { dmg += player.dashDmg; m.dashHitId = player.dashId; }
      if (lrect && rectsOverlap(lrect, m)) dmg += LASER_DMG;
      dmg *= atkMul();
      if (dmg > 0) {
        m.hp -= dmg; m.flash = 6; spawnParticles(m.x+m.w/2, m.y+m.h/2, '#fff', 6, 5);
        if (consume) { byeongMeleeReact(); shakeAmt = Math.max(shakeAmt, 7); }
      }
    }
    byMinions = byMinions.filter(m => m.hp > 0);
    // 분신 피해 (특수게이지 안 오름)
    for (const c of byClones) {
      let dmg = 0, consume = false;
      if (mrect && rectsOverlap(mrect, c)) { dmg += player.meleeDmg; consume = true; }
      if (dashing && c.dashHitId !== player.dashId && rectsOverlap(player, c)) { dmg += player.dashDmg; c.dashHitId = player.dashId; }
      if (lrect && rectsOverlap(lrect, c)) dmg += LASER_DMG;
      dmg *= atkMul();
      if (dmg > 0) {
        c.flash = 6; spawnParticles(c.x+c.w/2, c.y+c.h/2, '#fff', 8, 5);
        if (consume) { byeongMeleeReact(); shakeAmt = Math.max(shakeAmt, 8); }
        if (c.isMain) {
          boss.x = clamp(c.x, 40, W - boss.w - 40); boss.y = GROUND_Y - boss.h; boss.visible = true;
          damageBoss(dmg);
          if (state !== 'PLAY') return;
          byeongEndPattern2(true);
          return;
        } else {
          if (!c.active) { c.active = true; popText(c.x+c.w/2, c.y-10, '!', '#ff6b8e'); }
          c.hp -= dmg;
        }
      }
    }
    byClones = byClones.filter(c => !(c.active && c.hp <= 0));
  }
  function updateByeongEntities() {
    // 2페이즈: 하늘에서 1초마다 랜덤 위치에 빗방울
    if (boss.phase2) {
      boss.rainTimer = (boss.rainTimer || 0) - 1;
      if (boss.rainTimer <= 0) {
        for (let i = 0; i < 3; i++) byRain.push({ x: rand(10, W-10), y: -12, vy: rand(7, 10) });
        boss.rainTimer = 45;   // 0.75초마다
      }
    }
    for (const r of byRain) {
      r.y += r.vy; r.vy += 0.15;
      if (rectsOverlap({ x: r.x-3, y: r.y-8, w: 6, h: 16 }, player)) { damagePlayer(); r.y = H + 99; }
      else if (r.y > GROUND_Y) { spawnParticles(r.x, GROUND_Y, '#7fb0ff', 3, 3); r.y = H + 99; }
    }
    byRain = byRain.filter(r => r.y < H + 50);
    // 졸개 이동/공격
    for (const m of byMinions) {
      if (m.flash > 0) m.flash--;
      if (!m.grounded) {
        m.vy += GRAV; m.x += m.vx; m.y += m.vy;
        if (m.y + m.h >= GROUND_Y) { m.y = GROUND_Y - m.h; m.vy = 0; m.grounded = true; spawnParticles(m.x+m.w/2, GROUND_Y, '#cdbb98', 6, 4); }
      } else if (m.kind === 'sun') {
        const dir = (player.x+player.w/2 < m.x+m.w/2) ? -1 : 1; m.x += dir * 1.8;   // 플레이어 추격
      } else {
        const dir = (player.x+player.w/2 < m.x+m.w/2) ? -1 : 1; m.x += dir * 0.5;
        m.shoot--; if (m.shoot <= 0) { fireByShot(m.x+m.w/2, m.y+m.h/2); m.shoot = 120; }   // 2초 간격 원거리
      }
      m.x = clamp(m.x, 0, W - m.w);
      if (rectsOverlap(m, player)) damagePlayer();
    }
    // 활성 분신 이동/접촉
    for (const c of byClones) {
      if (c.flash > 0) c.flash--;
      if (c.active) {
        if (c.y + c.h < GROUND_Y) { c.vy = (c.vy||0) + GRAV; c.y += c.vy; if (c.y + c.h >= GROUND_Y) { c.y = GROUND_Y - c.h; c.vy = 0; } }
        const dir = (player.x+player.w/2 < c.x+c.w/2) ? -1 : 1; c.x += dir * 1.2; c.x = clamp(c.x, 0, W - c.w);
        if (rectsOverlap(c, player)) damagePlayer();
      }
    }
    // 병철 탄
    for (const s of byShots) {
      s.x += s.vx; s.y += s.vy; s.life--;
      if (rectsOverlap({ x: s.x-9, y: s.y-9, w: 18, h: 18 }, player)) { damagePlayer(); s.life = 0; }
    }
    byShots = byShots.filter(s => s.life > 0 && s.x > -30 && s.x < W+30 && s.y > -30 && s.y < H+30);
    // 플레이어 공격 적용
    applyPlayerHitsToByeong();
  }

  // ----- 병현 그리기 -----
  // 사람 형태 캐릭터 (발끝 footY 기준). clothes=옷색.
  // 사각 몸통 + 원형 머리 (플레이어/기존 보스와 동일한 그림체)
  function drawByeongFigure(cx, footY, w, h, clothes, flash, facing, name, nameColor) {
    const top = footY - h;
    const headR = w * 0.36;
    const headCy = top + headR;
    const bodyTop = headCy + headR * 0.5;
    ctx.save();
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#13161c';
    // 몸 (옷)
    ctx.fillStyle = flash > 0 ? '#fff' : clothes;
    ctx.fillRect(cx - w/2, bodyTop, w, footY - bodyTop);
    ctx.strokeRect(cx - w/2, bodyTop, w, footY - bodyTop);
    // 머리
    ctx.fillStyle = flash > 0 ? '#fff' : '#ffe0bd';
    ctx.beginPath(); ctx.arc(cx, headCy, headR, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    // 눈
    ctx.fillStyle = '#1b2030';
    const es = Math.max(4, headR * 0.28), eo = headR * 0.4;
    ctx.fillRect(cx - eo + (facing>0 ? 2 : -es-2), headCy - es/2, es, es);
    ctx.fillRect(cx + eo - es + (facing>0 ? 2 : -es-2), headCy - es/2, es, es);
    ctx.restore();
    if (name) { ctx.fillStyle = nameColor || '#ffd24a'; ctx.font = 'bold 15px "Trebuchet MS"'; ctx.textAlign = 'center'; ctx.fillText(name, cx, top - 8); ctx.textAlign = 'left'; }
  }
  function drawBossByeong() {
    const b = boss;
    if (b.visible === false) return;
    const cx = b.x + b.w/2, footY = b.y + b.h;
    const sq = b.squish || 1, st = b.stretch || 1;
    ctx.save();
    ctx.translate(cx, footY); ctx.scale(st/Math.sqrt(sq), sq/Math.sqrt(st)); ctx.translate(-cx, -footY);   // 부풀기/늘어짐
    drawByeongFigure(cx, footY, b.w, b.h, b.flash > 0 ? '#fff' : '#c86fa0', b.flash, b.facing, null);
    ctx.restore();
    ctx.fillStyle = '#ffd24a'; ctx.font = 'bold 16px "Trebuchet MS"'; ctx.textAlign = 'center';
    ctx.fillText('병현', cx, b.y - 14); ctx.textAlign = 'left';
  }
  function drawByeongEntities() {
    // 빗방울 (2페이즈)
    if (byRain.length) {
      ctx.save(); ctx.strokeStyle = '#9ec4ff'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      for (const r of byRain) { ctx.beginPath(); ctx.moveTo(r.x, r.y - 9); ctx.lineTo(r.x, r.y + 5); ctx.stroke(); }
      ctx.restore();
    }
    // 빨간 네모 탄
    for (const s of byShots) {
      ctx.save(); ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 10;
      ctx.fillStyle = '#ff4b4b'; ctx.fillRect(s.x-9, s.y-9, 18, 18);
      ctx.lineWidth = 2; ctx.strokeStyle = '#7a0000'; ctx.strokeRect(s.x-9, s.y-9, 18, 18); ctx.restore();
    }
    ctx.textAlign = 'center';
    // 졸개
    for (const m of byMinions) {
      ctx.fillStyle = m.flash > 0 ? '#fff' : (m.kind === 'sun' ? '#6fb0c8' : '#c8866f');
      roundRect(m.x, m.y, m.w, m.h, 8); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#1c1420'; roundRect(m.x, m.y, m.w, m.h, 8); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(m.x+m.w/2-6, m.y+13, 4, 0, Math.PI*2); ctx.arc(m.x+m.w/2+6, m.y+13, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#221'; ctx.beginPath(); ctx.arc(m.x+m.w/2-6, m.y+13, 2, 0, Math.PI*2); ctx.arc(m.x+m.w/2+6, m.y+13, 2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffd24a'; ctx.font = 'bold 11px "Trebuchet MS"';
      ctx.fillText(m.kind === 'sun' ? '병순' : '병철', m.x+m.w/2, m.y-4);
      ctx.fillStyle = '#3a0008'; ctx.fillRect(m.x, m.y+m.h+3, m.w, 3);
      ctx.fillStyle = '#ff5b6e'; ctx.fillRect(m.x, m.y+m.h+3, m.w*clamp(m.hp/m.maxHp,0,1), 3);
    }
    // 분신 (사람 형태)
    for (const c of byClones) {
      const facing = (player.x+player.w/2 < c.x+c.w/2) ? -1 : 1;
      ctx.globalAlpha = c.active ? 1 : 0.92;
      drawByeongFigure(c.x + c.w/2, c.y + c.h, c.w, c.h, c.flash > 0 ? '#fff' : (c.active ? '#c86fa0' : '#8f6a82'), c.flash, facing, c.name, c.active ? '#ff6b8e' : '#ffd24a');
      ctx.globalAlpha = 1;
      if (c.active) { ctx.fillStyle = '#3a0008'; ctx.fillRect(c.x, c.y+c.h+4, c.w, 4); ctx.fillStyle = '#ff5b6e'; ctx.fillRect(c.x, c.y+c.h+4, c.w*clamp(c.hp/c.maxHp,0,1), 4); }
    }
    ctx.textAlign = 'left';
  }

  // ---------- 메인 루프 (고정 타임스텝) ----------
  const FIXED_DT = 1000 / 60;          // 60 업데이트/초 기준
  let lastT = performance.now();
  let acc = 0;
  function loop(now) {
    acc += now - lastT; lastT = now;
    if (acc > 200) acc = 200;          // 탭 전환 등 큰 갭 방지
    // 터치 엣지(새로 눌림) 계산
    touchEdge = {};
    for (const a in touchHeld) if (touchHeld[a] && !prevTouchHeld[a]) touchEdge[a] = true;
    prevTouchHeld = Object.assign({}, touchHeld);
    let ran = 0;
    while (acc >= FIXED_DT && ran < 5) {
      stepGame();
      if (ran === 0) { for (const k in pressed) pressed[k] = false; touchEdge = {}; }  // 엣지 입력은 1회만 소비
      acc -= FIXED_DT; ran++;
    }
    renderGame();
    requestAnimationFrame(loop);
  }

  resetGame();
  requestAnimationFrame(loop);
})();
</script>
