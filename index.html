<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SONGDIH 2.0</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #6e4a2b;
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.10) 0 2px, transparent 2px 70px),
      linear-gradient(180deg, #7a5230, #5e3e22);
    color: #fff;
    font-family: "Comic Sans MS", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    height: 100%;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
  }
  canvas {
    background: #e9e1cc;
    border: 8px solid #9c6b3a;
    border-radius: 8px;
    box-shadow: 0 14px 44px rgba(0,0,0,0.55), inset 0 0 0 2px #6e4523;
    box-sizing: border-box;
    display: block;
    touch-action: none;            /* 터치 스크롤/줌 방지 */
  }
  /* 모바일/작은 화면: 16:9 비율을 유지한 채 화면에 꽉 맞춤(찌그러짐 방지) */
  @media (pointer: coarse), (max-width: 900px) {
    #wrap { justify-content: center; }
    canvas {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(56.25vw, 100vh);   /* = width * 9/16 */
      border: 0;
      border-radius: 0;
    }
    #hint { display: none; }
  }
  #hint {
    margin-top: 12px;
    font-size: 13px;
    color: #ffe9c2;
    background: rgba(51, 80, 63, 0.92);
    border: 2px solid #2a3f33;
    padding: 7px 16px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }
  #hint b { color: #fff6df; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="hint">
    <b>①</b> 이동 ←→ · 점프 Z/Space · 근접 X · 대쉬 C · 특수 F &nbsp;|&nbsp; <b>②</b> 이동 AD · 점프 Space · 근접 Enter · 대쉬 Shift · 특수 E
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const GROUND_Y = 470;          // 바닥선 (y)
  const GRAV = 0.55;             // 중력 (낮을수록 체공 ↑)

  // ---------- 입력 ----------
  const keys = {};
  const pressed = {};            // 이번 프레임에 새로 눌린 키 (엣지 감지)
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k)) e.preventDefault();
    if (!keys[k]) pressed[k] = true;
    keys[k] = true;
  });
  window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

  // ---------- 조작 모드 ----------
  const CONTROLS = {
    1: { left:['arrowleft'], right:['arrowright'], down:['arrowdown'], up:['arrowup'], jump:['z',' '], melee:['x'], dash:['c'], special:['f'] },
    2: { left:['a'], right:['d'], down:['s'], up:['w'], jump:[' '], melee:['enter'], dash:['shift'], special:['e'] },
  };
  let controlScheme = 1;
  function actHeld(a) { return !!touchHeld[a] || CONTROLS[controlScheme][a].some(k => keys[k]); }
  function actPressed(a) { return !!touchEdge[a] || CONTROLS[controlScheme][a].some(k => pressed[k]); }

  // ---------- 모바일 터치(조이스틱) 컨트롤 ----------
  const mobileMode = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  let touchHeld = {};            // 액션 -> 눌림(유지)
  let touchEdge = {};            // 액션 -> 이번 프레임 새로 눌림
  let prevTouchHeld = {};
  const activeTouches = {};      // id -> {x, y}
  // 컨트롤 배치(캔버스 좌표 960x540)
  const TC = {
    dpad: { cx: 155, cy: 388, R: 120, dead: 20 },
    melee:   { cx: 812, cy: 458, r: 44, label: '공격', col: '#4ec5f1' },
    jump:    { cx: 908, cy: 458, r: 44, label: '점프', col: '#7ab86a' },
    dash:    { cx: 812, cy: 360, r: 28, label: '대쉬', col: '#7fe3ff' },
    special: { cx: 908, cy: 360, r: 28, label: '특수', col: '#b072ff' },
  };
  function touchPos(t) {
    const rect = cv.getBoundingClientRect();
    return { x: (t.clientX - rect.left) * (W / rect.width), y: (t.clientY - rect.top) * (H / rect.height) };
  }
  function inCircle(x, y, c) { return Math.hypot(x - c.cx, y - c.cy) < c.r; }
  function applyTouchPoint(x, y, h) {
    if (inCircle(x, y, TC.melee)) h.melee = true;
    if (inCircle(x, y, TC.jump)) h.jump = true;
    if (inCircle(x, y, TC.dash)) h.dash = true;
    if (inCircle(x, y, TC.special)) h.special = true;
    // 십자 조이스틱: 화면 왼쪽 영역 어디든 작동, 중심 기준 X·Y 독립 판정(대각선 둘 다 입력)
    if (x < W * 0.45) {
      const dx = x - TC.dpad.cx, dy = y - TC.dpad.cy;
      if (dx < -TC.dpad.dead) h.left = true; else if (dx > TC.dpad.dead) h.right = true;
      if (dy < -TC.dpad.dead) h.up = true; else if (dy > TC.dpad.dead) h.down = true;
    }
  }
  function recomputeTouchHeld() {
    const h = {};
    for (const id in activeTouches) { const t = activeTouches[id]; applyTouchPoint(t.x, t.y, h); }
    touchHeld = h;
  }
  // 게임플레이/이동 구간에서 터치 컨트롤 사용(메뉴/상점은 탭=클릭)
  function touchControlsActive() { return mobileMode && (state === 'PLAY' || state === 'TRANSITION' || CUTSCENES.includes(state)); }
  function clearTouchState() {   // 터치 상태 완전 초기화(고정 버그 방지)
    for (const k in activeTouches) delete activeTouches[k];
    touchHeld = {}; touchEdge = {}; prevTouchHeld = {};
  }
  if (mobileMode) {
    const onTouch = (e) => {
      // 손가락을 뗀/취소된 터치는 상태와 무관하게 항상 제거(떼었는데 고정되는 버그 방지)
      if (e.type === 'touchend' || e.type === 'touchcancel') {
        for (const t of e.changedTouches) delete activeTouches[t.identifier];
        recomputeTouchHeld();
        return;
      }
      if (!touchControlsActive()) return;   // 메뉴 등은 기본 동작(클릭) 허용
      e.preventDefault();
      for (const t of e.changedTouches) activeTouches[t.identifier] = touchPos(t);
      recomputeTouchHeld();
    };
    cv.addEventListener('touchstart', onTouch, { passive: false });
    cv.addEventListener('touchmove', onTouch, { passive: false });
    cv.addEventListener('touchend', onTouch, { passive: false });
    cv.addEventListener('touchcancel', onTouch, { passive: false });
  }

  // ---------- 로그인 / 상점 / 도구 ----------
  const ITEMS = {
    longsword: { name: '장검', cost: 200, slots: 2, range: 0.40, color: '#bcd2ff',
                 desc: '사거리 40% 증가 · 2칸' },
    magicbook: { name: '마법서', cost: 300, slots: 1, specialMul: 0.25, color: '#b072ff',
                 desc: '특수공격 데미지 +25% · 1칸' },
    smoke:     { name: '연막탄', cost: 500, slots: 3, dashInvuln: true, tag: 'unique', color: '#9aa3b0',
                 desc: '대쉬 중 무적 · 3칸 · 고유' },
    heart:     { name: '하트 펜던트', cost: 250, slots: 1, hp: 1, color: '#ff6b8e',
                 desc: '체력 +1 · 1칸' },
    stretch:   { name: '살아나는 기지개', cost: 600, slots: 3, hp: 4, color: '#ffd24a',
                 desc: '체력 +4 · 3칸' },
    springpad: { name: '도약 발판', cost: 400, slots: 2, dashDist: 0.5, color: '#5be0c0',
                 desc: '대쉬 거리 50% 증가 · 2칸' },
    dagger:    { name: '암살용 단검', cost: 350, slots: 3, dashDmg: 20, tag: 'unique', color: '#c8ccda',
                 desc: '대쉬에 20 피해 추가 · 3칸 · 고유' },
    buttslam:  { name: '뜨끈한 엉덩방아', cost: 1000, slots: 2, tag: 'special', special: 'buttslam', color: '#ff9a3d',
                 desc: '특수: 엉덩방아 내려찍기(주변 30) · 2칸 · 특수' },
    prayer:    { name: '회복의 기원', cost: 1000, slots: 3, tag: 'special', special: 'heal', color: '#7fe3ff',
                 desc: '특수: HP 1 회복(게이지 2배) · 3칸 · 특수' },
    oil:       { name: '윤활유', cost: 250, slots: 1, meleeCd: 1.8, color: '#cfe08a',
                 desc: '근접 쿨타임 0.03초 감소 · 1칸' },
    wristband: { name: '손목 보호대', cost: 600, slots: 3, autoMelee: true, tag: 'unique', color: '#d08a5a',
                 desc: '근접키 홀드 시 자동 연타 · 3칸 · 고유' },
    hood:      { name: '두건', cost: 500, slots: 4, dodge: 0.3, tag: 'unique', color: '#6a7a5a',
                 desc: '30% 확률로 피해 무시 · 4칸 · 고유' },
    adrenaline:{ name: '아드레날린', cost: 300, slots: 2, adrenaline: true, tag: 'unique', color: '#ff5b5b',
                 desc: '체력 1칸일 때 공격력 2배 · 2칸 · 고유' },
    sole:      { name: '튼튼한 밑창', cost: 700, slots: 3, noFallDmg: true, tag: 'unique', color: '#8a8a9a',
                 desc: '낙오 피해 무효 · 3칸 · 고유' },
  };
  const SPECIAL_GAUGE = 100;   // 기본 특수 게이지
  let currentUser = null, profile = null;
  let drag = null, dragX = 0, dragY = 0;   // 드래그앤드롭 상태
  let panelScroll = 0;                     // 상점/장착 탭 스크롤 오프셋
  let equipMsg = null;                      // 장착 실패 안내 { text, life }
  function defaultProfile() { return { gold: 0, owned: {}, equipped: [], slots: 3, slotCost: 200 }; }
  function loadProfile(name) {
    let p;
    try { const raw = localStorage.getItem('songdih_user_' + name); p = raw ? JSON.parse(raw) : defaultProfile(); }
    catch (e) { p = defaultProfile(); }
    if (!p.owned) p.owned = {};
    if (!Array.isArray(p.equipped)) p.equipped = [];
    if (!p.slots) p.slots = 3;
    if (!p.slotCost) p.slotCost = 200;
    if (typeof p.gold !== 'number') p.gold = 0;
    profile = p; currentUser = name;
    try { localStorage.setItem('songdih_lastuser', name); } catch (e) {}
    saveProfile();   // 정규화된 상태 즉시 저장
  }
  function saveProfile() {
    if (!currentUser) return;
    try { localStorage.setItem('songdih_user_' + currentUser, JSON.stringify(profile)); } catch (e) {}
  }
  function doLogin() {
    const name = (window.prompt('아이디를 입력하세요 (저장용)') || '').trim();
    if (name) loadProfile(name);
  }
  function addGold(g) { if (profile) { profile.gold += g; saveProfile(); } }
  function ownedCount(id) { return (profile.owned && profile.owned[id]) || 0; }
  function equippedCount(id) { return profile.equipped.filter(x => x === id).length; }
  function availCount(id) { return ownedCount(id) - equippedCount(id); }
  function usedSlots() { return profile.equipped.reduce((s, id) => s + (ITEMS[id] ? ITEMS[id].slots : 1), 0); }
  function equipBonus() {
    const b = { hp: 0, range: 1, specialMul: 1, dashInvuln: false, dashDist: 1, dashDmg: 0, special: 'laser',
                meleeCd: 0, autoMelee: false, dodge: 0, adrenaline: false, noFallDmg: false };
    if (profile) for (const id of profile.equipped) {
      const it = ITEMS[id]; if (!it) continue;
      if (it.range) b.range += it.range;
      if (it.hp) b.hp += it.hp;
      if (it.specialMul) b.specialMul += it.specialMul;
      if (it.dashInvuln) b.dashInvuln = true;
      if (it.dashDist) b.dashDist += it.dashDist;
      if (it.dashDmg) b.dashDmg += it.dashDmg;
      if (it.special) b.special = it.special;
      if (it.meleeCd) b.meleeCd += it.meleeCd;
      if (it.autoMelee) b.autoMelee = true;
      if (it.dodge) b.dodge += it.dodge;
      if (it.adrenaline) b.adrenaline = true;
      if (it.noFallDmg) b.noFallDmg = true;
    }
    return b;
  }
  // 장착 가능 여부: 칸 + 고유(종류별 1개) + 특수(전체 1개) 제약
  function canEquip(id) {
    const it = ITEMS[id]; if (!it) return false;
    if (usedSlots() + it.slots > profile.slots) return false;
    if (it.tag === 'unique' && equippedCount(id) >= 1) return false;
    if (it.tag === 'special') {
      for (const eid of profile.equipped) { if (ITEMS[eid] && ITEMS[eid].tag === 'special') return false; }
    }
    return true;
  }
  // 초기 로딩: 마지막 유저 자동 로그인, 없으면 게스트
  try { const last = localStorage.getItem('songdih_lastuser'); if (last) loadProfile(last); } catch (e) {}
  if (!profile) profile = defaultProfile();
  window.addEventListener('beforeunload', saveProfile);   // 종료 시 확실히 저장

  // ---------- 게임 상태 ----------
  let state = 'MENU';            // MENU | INTRO | PLAY | WIN | LOSE
  let frame = 0;
  let intro = null;              // 입장 연출 컨트롤러
  let enrage = null;             // 강화(분노) 연출 컨트롤러
  let die = null;                // 보스 사망 연출 컨트롤러
  let shakeAmt = 0;              // PLAY 화면 흔들림
  let hitStop = 0;               // 타격감(잠깐 정지)
  let hitFlash = 0;              // 피격 시 붉은 플래시
  let stage = 1;                 // 1: Ssun(교실)  2: skirr boi(작업실)
  let platforms = [];            // 스테이지2 플랫폼 [{x,y,w}]
  let intro2 = null;             // 스테이지2 보스 입장 연출
  let intro3 = null;             // 스테이지3 보스 입장 연출
  const DANGER_Y = H - 18;       // 스테이지2 바닥(낙하 피해)
  let waves = [];                // 음파 공격
  let bullets = [];              // 가사 총알
  let neonSquares = [];          // 네온 네모
  let neonWall = null;           // 네온 벽 생성기
  let micProjs = [];             // 불타는 마이크 부메랑
  let skirrRage = null;          // skirr 2페이즈 연출
  let skirrRevive = null;        // skirr 3페이즈(부활) 연출
  let redBlocks = [];            // 2페이즈 바닥에서 솟는 빨간 네모
  let redTimer = 0;
  let pShots = [];               // P키 100데미지 투사체
  let laughs = [];               // Hansubal "하학!" 투사체
  let notes = [];                // Hansubal 노란 음표
  let noteLaser = null;          // Hansubal 음표 레이저
  let mapAtk = 0;                // 맵 전체공격 플래시
  let clockWarns = [];           // 67시계: 플레이어 위치 경고/폭발
  let hanRage = null;            // Hansubal 2페이즈 연출
  let hanMines = [];             // Hansubal 2페이즈 하학! 지뢰
  let byMinions = [];            // 병현: 병순/병철 졸개
  let byClones = [];             // 병현: 패턴2 분신
  let byShots = [];              // 병현: 병철 원거리 탄(빨간 네모)
  let byRain = [];               // 병현 2페이즈: 하늘 빗방울
  let intro4 = null;             // 병현 입장 컷씬
  let byLonely = null;           // 병현 lonely(2페이즈) 연출
  let skipHold = 0;              // 컷씬 스킵: 스페이스 홀드 프레임
  let upgrade = null;            // 보스 클리어 강화 선택 { next }
  let cheatBuf = '';             // 메인화면 치트 입력
  const CUTSCENES = ['INTRO','ENRAGE','BOSSDIE','INTRO2','SKIRRRAGE','SKIRRREVIVE','INTRO3','HANRAGE','INTRO4','BYLONELY'];

  // ---------- 엔티티 ----------
  let player, boss, burps, fartZones, particles, laser, floatTexts;

  function resetGame() {
    player = {
      x: 180, y: GROUND_Y - 51, w: 29, h: 51,
      vx: 0, vy: 0, onGround: true,
      hp: 5, maxHp: 5,
      facing: 1,
      special: 0, maxSpecial: 100,
      meleeTimer: 0, meleeCd: 0, meleeHit: false, meleeDir: 'side',
      dashTimer: 0, dashCd: 0, dashDir: 1,
      invuln: 0, castTimer: 0, kbx: 0,
      sx: 1, sy: 1, trail: [],          // 스쿼시·스트레치 / 대시 잔상
      stunTimer: 0,                     // 피격 경직
      dropTimer: 0,                     // 플랫폼 아래로 내려가기
      meleeDmg: 8, moveSpeed: 6.3, meleeCdBase: 18,   // 강화로 변하는 능력치
      rangeMul: 1, specialMul: 1, dashInvuln: false,  // 장비 효과
      dashDistMul: 1, dashDmg: 0, dashHitDone: false, // 대쉬 강화(도약 발판/암살용 단검)
      specialKind: 'laser', slamPhase: 0,             // 특수공격 종류 / 엉덩방아 상태
    };
    const eb = equipBonus();                          // 장착 도구 효과 적용
    player.maxHp = 5 + eb.hp; player.hp = player.maxHp;
    player.rangeMul = eb.range; player.specialMul = eb.specialMul; player.dashInvuln = eb.dashInvuln;
    player.dashDistMul = eb.dashDist; player.dashDmg = eb.dashDmg;
    player.specialKind = eb.special;
    player.maxSpecial = (eb.special === 'heal') ? SPECIAL_GAUGE * 2 : SPECIAL_GAUGE;   // 회복의 기원: 2배 요구
    player.special = 0;
    player.meleeCdBase = Math.max(2, player.meleeCdBase - eb.meleeCd);   // 윤활유
    player.autoMelee = eb.autoMelee; player.dodge = eb.dodge; player.adrenaline = eb.adrenaline; player.noFallDmg = eb.noFallDmg;
    boss = {
      type: 'ssun',
      x: 700, y: GROUND_Y - 150, w: 60, h: 150,   // 마른 체형
      hp: 300, maxHp: 300,
      state: 'approach', timer: 90,
      sub: 0, subTimer: 0,
      swingTimer: 0, swingHit: false,
      stun: 0, enraged: false, roar: false, vy: 0,
      flash: 0, bob: 0, facing: -1,
    };
    stage = 1;
    platforms = [];
    intro2 = null; intro3 = null;
    waves = []; bullets = []; neonSquares = []; neonWall = null; micProjs = []; skirrRage = null; skirrRevive = null; redBlocks = []; redTimer = 0; pShots = [];
    laughs = []; notes = []; noteLaser = null; mapAtk = 0; clockWarns = []; hanRage = null; hanMines = [];
    byMinions = []; byClones = []; byShots = []; byRain = []; intro4 = null; byLonely = null;
    burps = [];
    fartZones = [];             // [{ x, w, life, max }]
    laser = null;               // { y, h, dir, life, hit }
    particles = [];
    floatTexts = [];
    shakeAmt = 0;
    hitStop = 0;
    hitFlash = 0;
    if (mobileMode) clearTouchState();   // 재시작 시 조이스틱/버튼 고정 방지
  }

  // ---------- 유틸 ----------
  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function atkMul() { return (player && player.adrenaline && player.hp <= 1) ? 2 : 1; }   // 아드레날린: 1칸일 때 2배
  function lerp(a, b, t) { return a + (b - a) * t; }
  function burpBox(b) { return { x: b.x - b.r, y: b.y - b.r, w: b.r*2, h: b.r*2 }; }
  function clearBurpsInRect(r) {            // 플레이어 공격으로 트름 격추
    let hit = false;
    for (const b of burps) {
      if (b.life > 0 && rectsOverlap(burpBox(b), r)) {
        b.life = 0; hit = true;
        spawnParticles(b.x, b.y, '#9be84a', 8, 6);
      }
    }
    if (hit) burps = burps.filter(b => b.life > 0);
    return hit;
  }

  function spawnParticles(x, y, color, n, spd) {
    for (let i = 0; i < n; i++) {
      const ang = rand(0, Math.PI * 2);
      const s = rand(spd * 0.3, spd);
      particles.push({ x, y, vx: Math.cos(ang) * s, vy: Math.sin(ang) * s - 1, life: rand(18, 34), color });
    }
  }
  function popText(x, y, txt, color) {
    floatTexts.push({ x, y, txt, color, life: 40 });
  }

  function damageBoss(dmg) {
    boss.hp = Math.max(0, boss.hp - dmg);
    boss.flash = 8;
    popText(boss.x + boss.w / 2, boss.y - 10, '-' + dmg, '#ffd24a');
    spawnParticles(boss.x + boss.w / 2, boss.y + 40, '#ff7676', 10, 5);
    checkBossDefeat();
  }
  // 사망 / skirr 부활 분기
  function checkBossDefeat() {
    if (boss.type === 'skirr' && !boss.revived && boss.hp < 30) { startSkirrRevive(); return; }
    if (boss.hp <= 0) startBossDie();
  }
  function damagePlayer() {
    if (player.invuln > 0 || player.castTimer > 0) return;   // 피격 후/특수공격 중 무적
    if (player.dashInvuln && player.dashTimer > 0) return;   // 연막탄: 대쉬 중 무적
    if (player.dodge && Math.random() < player.dodge) {       // 두건: 확률 회피
      player.invuln = 16; popText(player.x + player.w/2, player.y - 6, 'MISS', '#cfe08a'); return;
    }
    player.hp -= 1;
    player.invuln = 70;
    player.stunTimer = 20;                 // 잠시 경직
    hitStop = 6;
    hitFlash = 9;
    shakeAmt = Math.max(shakeAmt, 13);
    player.sx = 1.35; player.sy = 0.75;
    // 보스 반대쪽으로 튕겨남
    const away = (player.x + player.w/2 < boss.x + boss.w/2) ? -1 : 1;
    player.kbx = away * 7;
    player.vy = -5;
    player.onGround = false;
    popText(player.x + player.w / 2, player.y - 6, '-1', '#ff3b3b');
    spawnParticles(player.x + player.w / 2, player.y + player.h/2, '#ff5b5b', 16, 7);
    spawnParticles(player.x + player.w / 2, player.y + player.h/2, '#ffffff', 8, 9);
    if (player.hp <= 0) { player.hp = 0; state = 'LOSE'; }
  }

  function gainSpecial() {
    const g = Math.floor(rand(10, 21));   // 10~20
    player.special = clamp(player.special + g, 0, player.maxSpecial);
  }

  // 스테이지별 착지/낙하 처리
  function landOrFall(impactVy) {
    if (state === 'TRANSITION') {           // 이동 구간엔 단단한 바닥
      if (player.y + player.h >= GROUND_Y) { player.y = GROUND_Y - player.h; player.vy = 0; player.onGround = true; }
      else player.onGround = false;
      return;
    }
    if (stage === 4) {                      // 일자형 맵: 단단한 바닥
      if (player.y + player.h >= GROUND_Y) {
        if (!player.onGround && impactVy > 6) { player.sx = 1.4; player.sy = 0.62; spawnParticles(player.x + player.w/2, GROUND_Y - 3, '#6e553a', 10, 5); shakeAmt = Math.max(shakeAmt, 5); }
        player.y = GROUND_Y - player.h; player.vy = 0; player.onGround = true;
      } else player.onGround = false;
      return;
    }
    if (stage >= 2) {
      if (player.dropTimer > 0) player.dropTimer--;
      player.onGround = false;
      if (player.vy >= 0 && player.dropTimer <= 0) {  // 하강 중·드롭 아닐 때만 플랫폼 착지(원웨이)
        for (const pf of platforms) {
          if (player.x + player.w > pf.x + 4 && player.x < pf.x + pf.w - 4) {
            const prevFeet = player.y + player.h - player.vy;
            if (player.y + player.h >= pf.y && prevFeet <= pf.y + 8) {
              player.y = pf.y - player.h; player.vy = 0; player.onGround = true;
              if (impactVy > 6) { player.sx = 1.4; player.sy = 0.62; spawnParticles(player.x+player.w/2, pf.y-3, '#aab0cc', 8, 5); shakeAmt = Math.max(shakeAmt, 4); }
              break;
            }
          }
        }
      }
      if (player.y + player.h >= DANGER_Y) {       // 바닥(위험) → 피해 + 튀어오름
        player.y = DANGER_Y - player.h;
        player.vy = -15;
        player.onGround = false;
        spawnParticles(player.x + player.w/2, DANGER_Y, '#ff5bd0', 14, 7);
        dangerHit();
      }
      return;
    }
    // 스테이지1: 단단한 바닥
    if (player.y + player.h >= GROUND_Y) {
      if (!player.onGround && impactVy > 6) {
        player.sx = 1.4; player.sy = 0.62;
        spawnParticles(player.x + player.w/2, GROUND_Y - 3, '#cdbb98', 10, 5);
        shakeAmt = Math.max(shakeAmt, 5);
      }
      player.y = GROUND_Y - player.h; player.vy = 0; player.onGround = true;
    } else player.onGround = false;
  }
  function dangerHit() {
    if (player.noFallDmg) return;   // 튼튼한 밑창: 낙오 피해 무효
    if (player.invuln > 0) return;
    player.hp -= 1; player.invuln = 50;
    hitFlash = 8; shakeAmt = Math.max(shakeAmt, 11);
    player.sx = 1.3; player.sy = 0.78;
    popText(player.x + player.w/2, player.y - 6, '-1', '#ff5bd0');
    if (player.hp <= 0) { player.hp = 0; state = 'LOSE'; }
  }

  // 레이저: 1초 유지, 0.1초(6프레임)마다 2.25데미지 (총 22.5) + 적 경직
  function updateLaser() {
    if (!laser) return;
    laser.life--;
    laser.tick--;
    const beam = {
      x: laser.dir > 0 ? player.x + player.w : 0,
      y: laser.y,
      w: laser.dir > 0 ? W - (player.x + player.w) : player.x,
      h: laser.h
    };
    clearBurpsInRect(beam);                   // 레이저로 트름 격추
    if (laser.tick <= 0) {
      laser.tick = 6;                         // 0.1초마다
      if (rectsOverlap(beam, boss)) {
        boss.hp = Math.max(0, boss.hp - 2.25 * (player.specialMul || 1) * atkMul());
        boss.flash = 5;
        boss.stun = 9;                        // 맞을 때마다 조금씩 경직
        spawnParticles(boss.x + boss.w/2, laser.y + laser.h/2, '#e0b3ff', 5, 4);
        checkBossDefeat();
        if (state !== 'PLAY') return;   // 사망/부활 연출 진입
      }
    }
    if (laser && laser.life <= 0) laser = null;
  }

  // 뜨끈한 엉덩방아 진행 (도약 → 내려찍기 → 착지 폭발)
  function updateSlam() {
    player.invuln = Math.max(player.invuln, 2);     // 진행 중 무적 유지
    if (player.slamPhase === 1) {                   // 상승 후 정점에서 전환
      player.vy += GRAV;
      if (player.vy >= 0) { player.slamPhase = 2; }
    } else if (player.slamPhase === 2) {            // 빠르게 내려찍기
      player.vy = 26;
    }
    if (frame % 2 === 0) player.trail.push({ x: player.x, y: player.y, life: 9 });
    for (const tr of player.trail) tr.life--;
    player.trail = player.trail.filter(tr => tr.life > 0);
    const impactVy = player.vy;
    player.y += player.vy;
    landOrFall(impactVy);
    player.x = clamp(player.x, 0, W - player.w);
    const landed = player.onGround || (stage >= 2 && player.y + player.h >= DANGER_Y - 1);
    if (player.slamPhase === 2 && landed) {          // 착지 충격
      player.slamPhase = 0;
      player.invuln = 60;                            // 착지 후 1초 무적
      player.sx = 1.5; player.sy = 0.55;
      shakeAmt = Math.max(shakeAmt, 16);
      spawnParticles(player.x + player.w/2, player.y + player.h, '#ff9a3d', 22, 9);
      const hb = { x: player.x + player.w/2 - 95, y: player.y - 24, w: 190, h: player.h + 48 };
      if (rectsOverlap(hb, boss)) { damageBoss(30 * atkMul()); gainSpecial(); }
      if (stage === 4) byeongSlamHit(hb, 30 * atkMul());   // 졸개·분신에도 광역 피해
      if (state !== 'PLAY') return;
    }
    // 타이머 갱신(무적 외)
    if (player.dashCd > 0) player.dashCd--;
    if (player.meleeCd > 0) player.meleeCd--;
  }

  // ---------- 플레이어 업데이트 ----------
  function updatePlayer(lockAttacks) {
    // 특수공격 시전 중: 완전 경직(이동·행동 불가) + 무적
    if (player.castTimer > 0) {
      player.castTimer--;
      player.vx = 0; player.vy = 0;   // 공중에서도 그 자리에 고정
      updateLaser();
      if (player.castTimer === 0) player.invuln = 60;  // 시전 후 1초 무적(이동 가능)
      return;
    }
    // 엉덩방아 진행 중: 전용 물리
    if (player.slamPhase > 0) { updateSlam(); return; }

    // 피격 경직: 입력 불가, 넉백·물리만 적용
    if (player.stunTimer > 0) {
      player.stunTimer--;
      if (player.dashTimer > 0) player.vy = 0; else player.vy += GRAV;
      player.x += player.kbx;
      if (player.kbx) { player.kbx *= 0.82; if (Math.abs(player.kbx) < 0.3) player.kbx = 0; }
      const impVy = player.vy;
      player.y += player.vy;
      landOrFall(impVy);
      player.x = clamp(player.x, 0, W - player.w);
      player.sx += (1 - player.sx) * 0.25; player.sy += (1 - player.sy) * 0.25;
      if (player.invuln > 0) player.invuln--;
      if (player.dashTimer > 0) player.dashTimer--;
      if (player.dashCd > 0) player.dashCd--;
      if (player.meleeCd > 0) player.meleeCd--;
      if (player.meleeTimer > 0) player.meleeTimer--;
      return;
    }

    let move = 0;
    if (actHeld('left')) move -= 1;
    if (actHeld('right')) move += 1;
    const meleeLock = player.meleeTimer > 0 && player.dashTimer <= 0 && player.meleeDir !== 'down';  // 공격 중 좌우 잠금(아래공격 제외)
    if (move !== 0 && player.dashTimer <= 0 && !meleeLock) player.facing = move;
    if (meleeLock) move = 0;

    if (player.dashTimer > 0) player.vx = player.dashDir * 11 * (player.dashDistMul || 1);
    else player.vx = move * player.moveSpeed;

    // 아래 키로 플랫폼 통과해 내려가기 (스테이지2+ )
    if (stage >= 2 && actPressed('down') && player.onGround) {
      player.dropTimer = 12;
      player.onGround = false;
      player.vy = 1;
    }
    // 점프 (Z) — 솟구치는 스트레치
    if (actPressed('jump') && player.onGround) {
      player.vy = -15.5;
      player.onGround = false;
      player.sx = 0.78; player.sy = 1.3;
      spawnParticles(player.x + player.w/2, GROUND_Y - 2, '#cdbb98', 6, 4);
    }
    // 대쉬 (C)
    if (actPressed('dash') && player.dashCd <= 0) {
      player.dashTimer = 11;
      player.dashCd = 40;
      player.dashDir = player.facing;
      player.dashHitDone = false;            // 보스 본체 단검 피해 1회
      player.dashId = (player.dashId || 0) + 1;   // 졸개·분신은 대쉬당 각 1회
      player.sx = 1.4; player.sy = 0.72;     // 쭉 늘어나는 대시
      spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#7fe3ff', 12, 6);
    }
    // 암살용 단검: 대쉬가 보스에 닿으면 추가 피해(대쉬당 1회)
    if (player.dashTimer > 0 && player.dashDmg > 0 && !player.dashHitDone && rectsOverlap(player, boss)) {
      player.dashHitDone = true;
      damageBoss(player.dashDmg * atkMul());
      gainSpecial();
      hitStop = 3; shakeAmt = Math.max(shakeAmt, 8);
      spawnParticles(boss.x + boss.w/2, player.y + player.h/2, '#c8ccda', 14, 8);
      if (state !== 'PLAY') return;
    }
    // 근접공격 (X) : 방향 결정 (위 / 아래(공중) / 옆) — 손목 보호대: 홀드 시 자동 연타
    if ((actPressed('melee') || (player.autoMelee && actHeld('melee'))) && player.meleeCd <= 0 && !lockAttacks) {
      player.meleeTimer = 12;
      player.meleeCd = player.meleeCdBase;
      player.meleeHit = false;
      if (actHeld('up')) player.meleeDir = 'up';
      else if (actHeld('down') && !player.onGround) player.meleeDir = 'down';
      else player.meleeDir = 'side';
    }
    // 특수공격 (F) : 장착된 특수 도구에 따라 분기
    if (actPressed('special') && player.special >= player.maxSpecial && player.castTimer <= 0 && player.slamPhase <= 0 && !lockAttacks) {
      const kind = player.specialKind || 'laser';
      if (kind === 'heal') {                 // 회복의 기원: HP 1 회복
        player.special = 0;
        player.hp = Math.min(player.maxHp, player.hp + 1);
        player.castTimer = 24;
        player.vx = 0;
        popText(player.x + player.w/2, player.y - 8, '+1 HP', '#7fe3ff');
        spawnParticles(player.x + player.w/2, player.y + player.h/2, '#7fe3ff', 22, 6);
      } else if (kind === 'buttslam') {       // 뜨끈한 엉덩방아: 도약 후 내려찍기
        player.special = 0;
        player.slamPhase = 1;                // 1: 도약 상승
        player.vy = -16; player.onGround = false;
        player.invuln = 9999;               // 도약~착지 후 1초까지 무적
        player.sx = 0.8; player.sy = 1.3;
        spawnParticles(player.x + player.w/2, player.y + player.h, '#ff9a3d', 16, 7);
      } else {                                // 기본: 레이저
        player.special = 0;
        player.castTimer = 30;
        player.vx = 0;
        laser = { dir: player.facing, life: 30, tick: 0,
                  y: player.y + player.h / 2 - 14, h: 28 };
        spawnParticles(player.x + (player.facing>0?player.w:0), player.y + player.h/2, '#b072ff', 18, 7);
      }
    }

    // 대쉬 잔상
    if (player.dashTimer > 0 && frame % 2 === 0) player.trail.push({ x: player.x, y: player.y, life: 9 });
    for (const tr of player.trail) tr.life--;
    player.trail = player.trail.filter(tr => tr.life > 0);

    // 물리 (대쉬 중에는 낙하 정지 = 공중 부양)
    if (player.dashTimer > 0) player.vy = 0;
    else player.vy += GRAV;
    player.x += player.vx + player.kbx;            // 넉백 포함
    if (player.kbx) { player.kbx *= 0.8; if (Math.abs(player.kbx) < 0.3) player.kbx = 0; }
    const impactVy = player.vy;
    player.y += player.vy;
    landOrFall(impactVy);
    player.x = clamp(player.x, 0, W - player.w);

    // 스쿼시/스트레치 복원 + 공중 세로 늘어남
    if (!player.onGround && player.dashTimer <= 0) {
      const st = clamp(player.vy / 26, -0.3, 0.3);
      player.sy += ((1 + st) - player.sy) * 0.25;
      player.sx += ((1 - st) - player.sx) * 0.25;
    } else {
      player.sx += (1 - player.sx) * 0.25;
      player.sy += (1 - player.sy) * 0.25;
    }

    // 타이머
    if (player.meleeTimer > 0) player.meleeTimer--;
    if (player.meleeCd > 0) player.meleeCd--;
    if (player.dashTimer > 0) player.dashTimer--;
    if (player.dashCd > 0) player.dashCd--;
    if (player.invuln > 0) player.invuln--;

    // 근접 히트박스 (방향별)
    if (player.meleeTimer > 0) {
      const cx = player.x + player.w/2;
      const R = 88 * (player.rangeMul || 1);   // 장검 등 사거리 적용
      const UD = 80 * (player.rangeMul || 1);
      let hb;
      if (player.meleeDir === 'up')
        hb = { x: cx - (player.w+40)/2, y: player.y + 8 - UD, w: player.w+40, h: UD };
      else if (player.meleeDir === 'down')
        hb = { x: cx - (player.w+40)/2, y: player.y + player.h - 8, w: player.w+40, h: UD };
      else
        hb = { x: player.facing > 0 ? player.x + player.w : player.x - R, y: player.y + 8, w: R, h: player.h - 16 };
      // 트름 격추 (휘두르는 동안 계속)
      clearBurpsInRect(hb);
      if (!player.meleeHit && rectsOverlap(hb, boss)) {
        player.meleeHit = true;
        damageBoss(player.meleeDmg * atkMul());
        gainSpecial();
        // 타격감: 잠깐 정지 + 화면 흔들림 + 임팩트 파편
        hitStop = 3;
        shakeAmt = Math.max(shakeAmt, 9);
        const ix = clamp(player.x + player.w/2 + player.facing*40, 0, W);
        const iy = player.meleeDir === 'up' ? player.y : player.meleeDir === 'down' ? player.y + player.h : player.y + player.h/2;
        spawnParticles(ix, iy, '#fff2a8', 12, 7);
        player.sx = 0.8; player.sy = 1.2;     // 휘두름 반동
        // 적중 시 공격 반대방향으로 조금씩 밀려남
        if (player.meleeDir === 'down') player.vy = -8;                    // 약하게 위로 (포고)
        else if (player.meleeDir === 'up') player.vy = Math.max(player.vy, 4); // 아래로 살짝
        else player.kbx = -player.facing * 4.5;                            // 옆: 뒤로
      }
    }

  }

  // ---------- 보스 패턴 발사 ----------
  function fireBurp(rad, angOff) {
    const r = rad || (boss.enraged ? 21 : 16);   // 강화 시 +30%
    const mx = boss.x + (player.x < boss.x ? 6 : boss.w - 6);
    const my = boss.y + 46;
    const dx = (player.x + player.w/2) - mx;
    const dy = (player.y + player.h/2) - my;
    const ang = Math.atan2(dy, dx) + (angOff || 0);
    const mul = boss.enraged ? 1.3 : 1;          // 강화 시 전체 구간 속도 +30%
    burps.push({
      x: mx, y: my, r,
      dirx: Math.cos(ang), diry: Math.sin(ang),
      spd: 1.6 * mul, spdMul: mul, age: 0, boosted: false, life: 240
    });
  }
  // 잽: 투사체가 아니라 직접 팔을 휘두르는 범위공격 + 휘두를 때마다 전진
  function doSwing() {
    boss.x += boss.facing * (boss.enraged ? 102 : 68);   // 강화 시 이동거리 1.5배
    boss.x = clamp(boss.x, 20, W - boss.w - 20);
    boss.swingTimer = 16;
    boss.swingHit = false;
    spawnParticles(boss.x + (boss.facing<0?0:boss.w), boss.y + 70, '#ffd27a', 8, 4);
    shakeAmt = Math.max(shakeAmt, boss.enraged ? 14 : 7);   // 휘두를 때마다 화면 흔들림
  }
  // 휘두르는 동안의 타격 판정 (위에서 아래로 내려치므로 바닥까지 닿음)
  function swingHitbox() {
    const reach = 88;
    const top = boss.y + 20;
    return {
      x: boss.facing < 0 ? boss.x - reach : boss.x + boss.w,
      y: top, w: reach, h: GROUND_Y - top
    };
  }

  // ---------- 보스 업데이트 ----------
  function updateBoss() {
    boss.bob += 0.08;
    if (boss.flash > 0) boss.flash--;

    if (boss.type === 'skirr') { updateSkirr(); return; }
    if (boss.type === 'hansubal') { updateHansubal(); return; }
    if (boss.type === 'byeong') { updateByeong(); return; }

    // 레이저 피격 경직: 잠시 모든 행동/이동 정지
    if (boss.stun > 0) {
      boss.stun--;
      const c = boss.x + boss.w/2, pc = player.x + player.w/2;
      boss.facing = pc < c ? -1 : 1;
      return;
    }

    // 휘두르는 팔 타격 판정 (이때는 김태양 몸 전체도 히트박스)
    if (boss.swingTimer > 0) {
      boss.swingTimer--;
      if (!boss.swingHit && (rectsOverlap(swingHitbox(), player) || rectsOverlap(boss, player))) {
        boss.swingHit = true;
        damagePlayer();
      }
    }

    const center = boss.x + boss.w/2;
    const pcenter = player.x + player.w/2;
    boss.facing = pcenter < center ? -1 : 1;

    switch (boss.state) {
      case 'approach': {
        if (Math.abs(pcenter - center) > 140) boss.x += boss.facing * 1.2;  // 접근 (속도 2배)
        boss.timer--;
        if (boss.timer <= 0) {
          const r = Math.floor(rand(0, 3));
          if (r === 0) { boss.state = 'burp_windup'; boss.timer = 45; }      // 패턴1
          else if (r === 1) { boss.state = 'jab_windup'; boss.timer = 40; }  // 패턴2
          else { boss.state = 'fart_windup'; boss.timer = 40; }              // 패턴3
        }
        break;
      }
      case 'burp_windup': {     // 잠시 정지
        boss.timer--;
        if (boss.timer <= 0) { boss.state = 'burp_fire'; boss.sub = 0; boss.subTimer = 0; }
        break;
      }
      case 'burp_fire': {       // 트름 (강화 시 7발)
        const gaps = boss.enraged ? [10,10,10,18,8,8,0] : [10,10,22,8,0];
        const cnt = gaps.length;
        boss.subTimer--;
        if (boss.subTimer <= 0 && boss.sub < cnt) {
          fireBurp(); boss.sub++;
          boss.subTimer = gaps[boss.sub - 1];
        }
        if (boss.sub >= cnt && boss.subTimer <= -20) { boss.state = 'approach'; boss.timer = 110; }
        break;
      }
      case 'jab_windup': {      // 잽 준비 (팔을 위로 치켜듦)
        boss.timer--;
        if (boss.timer <= 0) { boss.state = 'jab'; boss.sub = 0; boss.subTimer = 0; }
        break;
      }
      case 'jab': {             // 팔 휘두르기(범위) 3번, 휘두를 때마다 전진
        boss.subTimer--;
        const gap = boss.enraged ? 10 : 18;       // 강화 시 잽 간격 10프레임
        if (boss.subTimer <= 0 && boss.sub < 3) { doSwing(); boss.sub++; boss.subTimer = gap; }
        if (boss.sub >= 3 && boss.subTimer <= -15) { boss.state = 'approach'; boss.timer = 110; }
        break;
      }
      case 'fart_windup': {     // 앉는 모션
        boss.timer--;
        if (boss.timer <= 0) {
          if (boss.enraged) {
            // 강화: 방구 자체는 사라지고 일부 공간에 3초간 잔류
            fartZones = [];
            const n = 6;
            for (let i = 0; i < n; i++) {
              const w = rand(110, 190);
              const x = clamp(rand(0, W - w), 0, W - w);
              fartZones.push({ x, w, life: 180, max: 180 });   // 3초(180프레임)
              spawnParticles(x + w/2, GROUND_Y - 10, '#8cff6b', 10, 6);
            }
            boss.state = 'fart_active'; boss.timer = 40;
          } else {
            fartZones = [{ x: 0, w: W, life: 48, max: 48 }];    // 모든 바닥, 0.8초
            spawnParticles(center, GROUND_Y - 10, '#8cff6b', 24, 6);
            boss.state = 'fart_active'; boss.timer = 48;
          }
        }
        break;
      }
      case 'fart_active': {
        boss.timer--;
        if (boss.timer <= 0) { boss.state = 'approach'; boss.timer = 120; }
        break;
      }
    }
    boss.x = clamp(boss.x, 20, W - boss.w - 20);

    // 몸에 닿으면 데미지 (접촉 피해)
    if (rectsOverlap(boss, player)) damagePlayer();
  }

  // ---------- 발사체 업데이트 ----------
  function updateBurps() {       // 트름 이동 (연출 중에도 호출됨)
    for (const b of burps) {
      b.age++;
      if (!b.boosted && b.age > 45) {       // 처음엔 느리게, 갑자기 빠르게
        b.boosted = true;
        b.spd = 8.5 * (b.spdMul || 1);
        spawnParticles(b.x, b.y, '#c9ff8a', 6, 3);
      }
      b.x += b.dirx * b.spd;
      b.y += b.diry * b.spd;
      b.life--;
      // 연출(INTRO/ENRAGE) 중에는 플레이어에게 피해 없음
      if (state === 'PLAY' && rectsOverlap({x:b.x-b.r, y:b.y-b.r, w:b.r*2, h:b.r*2}, player)) { damagePlayer(); b.life = 0; }
    }
    burps = burps.filter(b => b.life > 0 && b.x > -60 && b.x < W+60 && b.y < H+60);
  }

  function updateProjectiles() {
    updateBurps();
    if (stage === 4) updateByeongEntities();

    // 방구 지대 (여러 패치 가능)
    for (const z of fartZones) {
      z.life--;
      const zone = { x: z.x, y: GROUND_Y - 12, w: z.w, h: 14 };
      if (player.onGround && rectsOverlap(zone, player)) damagePlayer();
    }
    fartZones = fartZones.filter(z => z.life > 0);

    // 음파
    for (const wv of waves) {
      wv.r += 5;
      if (!wv.hit) {
        const dx = (player.x+player.w/2) - wv.x, dy = (player.y+player.h/2) - wv.y;
        if (Math.hypot(dx, dy) <= wv.r) { wv.hit = true; damagePlayer(); }
      }
    }
    waves = waves.filter(wv => wv.r < wv.maxR);
    // 가사 총알
    for (const bl of bullets) {
      bl.x += bl.vx; bl.y += bl.vy; bl.life--;
      if (rectsOverlap({ x: bl.x-12, y: bl.y-16, w: 24, h: 24 }, player)) { damagePlayer(); bl.life = 0; }
    }
    bullets = bullets.filter(bl => bl.life > 0 && bl.x > -30 && bl.x < W+30 && bl.y > -30 && bl.y < H+30);
    // 네온 벽 (가운데에서 양옆으로 한 줄씩 퍼지며 상승: |c|+r == step 인 칸 생성)
    if (neonWall) {
      neonWall.timer++;
      if (neonWall.timer % 5 === 0) {
        const T = neonWall.step, tw = 44, th = 44;
        let any = false;
        for (let c = -T; c <= T; c++) {
          const r = T - Math.abs(c);              // 이 컬럼의 새 줄
          const x = neonWall.cx + c * tw * 4;     // 네 칸 간격
          const y = DANGER_Y - (r + 1) * th;
          if (y > -th && x > -tw && x < W) {
            neonSquares.push({ x, y, w: tw - 2, h: th - 2, life: 32 });
            any = true;
          }
        }
        neonWall.step++;
        if (!any || neonWall.step > 46) neonWall = null;
      }
    }
    for (const s of neonSquares) { s.life--; if (rectsOverlap(s, player)) damagePlayer(); }
    neonSquares = neonSquares.filter(s => s.life > 0);
    // 불타는 마이크 부메랑 (날아갈수록 커지고 돌아오며 작아짐)
    const OUT = 72, BACK = 54;
    for (const m of micProjs) {
      if (m.leg === 'out') {                         // 나갈 때: 빠르다 느려짐(ease-out)
        m.u += 1/OUT;
        if (m.u >= 1) { m.leg = 'back'; m.u = 0; m.s = 1; }
        else m.s = 1 - (1 - m.u) * (1 - m.u);
      } else {                                        // 돌아올 때: 점점 빨라짐(ease-in)
        m.u += 1/BACK;
        if (m.u >= 1) { m.dead = true; m.s = 0; }
        else m.s = 1 - m.u * m.u;
      }
      const ox = boss.x + boss.w/2, oy = boss.y + 40; // 보스에게 되돌아옴
      m.x = lerp(ox, m.tx, m.s);
      m.y = lerp(oy, m.ty, m.s);
      m.size = lerp(0.7, 2.3, m.s);
      m.rot += 0.5;                                   // 빙빙 회전
      const r = 9 * m.size;
      if (rectsOverlap({ x: m.x-r, y: m.y-r, w: r*2, h: r*2 }, player)) damagePlayer();
    }
    micProjs = micProjs.filter(m => !m.dead);
    // 2페이즈: 바닥에서 랜덤하게 솟는 빨간 네모
    if (boss.type === 'skirr' && boss.phase2) {
      redTimer--;
      if (redTimer <= 0) {
        redTimer = boss.revived ? 60 : 120;          // 3페: 1초 / 2페: 2초
        for (let i = 0; i < 2; i++) {                 // 한 번에 2개, 랜덤 위치
          const w = rand(30, 46);
          redBlocks.push({ x: clamp(rand(0, W-w), 0, W-w), y: DANGER_Y, w, h: w, vy: -1.2, life: 220 });
        }
      }
    }
    for (const rb of redBlocks) {
      rb.y += rb.vy; rb.vy *= 1.05;                   // 천천히 → 점점 빠르게(가속)
      if (rb.vy < -15) rb.vy = -15;
      rb.life--;
      if (rectsOverlap(rb, player)) damagePlayer();
    }
    redBlocks = redBlocks.filter(rb => rb.life > 0 && rb.y + rb.h > -10);
    // P키 투사체 (100 데미지)
    for (const s of pShots) {
      s.x += s.vx; s.life--;
      if (boss.hp > 0 && rectsOverlap({ x: s.x-12, y: s.y-12, w: 24, h: 24 }, boss)) { damageBoss(100); s.life = 0; }
    }
    pShots = pShots.filter(s => s.life > 0 && s.x > -30 && s.x < W+30);
    // Hansubal "하학!" 투사체
    for (const lh of laughs) {
      lh.x += lh.vx; lh.y += lh.vy; lh.life--;
      if (rectsOverlap({ x: lh.x - lh.size/2, y: lh.y - lh.size/2, w: lh.size, h: lh.size }, player)) { damagePlayer(); lh.life = 0; }
    }
    laughs = laughs.filter(l => l.life > 0 && l.x > -50 && l.x < W+50 && l.y > -50 && l.y < H+50);
    // 노란 음표
    for (const nt of notes) {
      nt.x += nt.vx; nt.y += nt.vy; nt.life--;
      if (rectsOverlap({ x: nt.x-10, y: nt.y-12, w: 20, h: 22 }, player)) { damagePlayer(); nt.life = 0; }
    }
    notes = notes.filter(n => n.life > 0 && n.x > -50 && n.x < W+50 && n.y > -50 && n.y < H+50);
    // 음표 레이저
    if (noteLaser) {
      noteLaser.life--;
      const dx = Math.cos(noteLaser.ang), dy = Math.sin(noteLaser.ang);
      const rx = (player.x+player.w/2) - noteLaser.x, ry = (player.y+player.h/2) - noteLaser.y;
      const proj = rx*dx + ry*dy, perp = Math.abs(rx*(-dy) + ry*dx);
      const hitW = (noteLaser.w || 16) / 2 + 8;
      if (proj > 0 && proj < 1100 && perp < hitW) damagePlayer();
      if (noteLaser.life <= 0) noteLaser = null;
    }
    if (mapAtk > 0) mapAtk--;
    // 67시계 경고 → 폭발
    for (const cw of clockWarns) {
      cw.timer--;
      if (cw.timer === 0 && !cw.hit) {   // 폭발: 그 자리에 있으면 피해
        cw.hit = true;
        if (Math.hypot((player.x+player.w/2)-cw.x, (player.y+player.h/2)-cw.y) < 44) damagePlayer();
        spawnParticles(cw.x, cw.y, '#5b8cff', 14, 6);
        shakeAmt = Math.max(shakeAmt, 6);
      }
    }
    clockWarns = clockWarns.filter(cw => cw.timer > -14);

    // 파티클 / 텍스트
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; }
    particles = particles.filter(p => p.life > 0);
    for (const t of floatTexts) { t.y -= 0.7; t.life--; }
    floatTexts = floatTexts.filter(t => t.life > 0);
  }

  // ---------- 그리기 : 교실 배경 ----------
  function drawWindow(x, y, w, h) {
    ctx.fillStyle = '#8a5a2b';                       // 창틀
    ctx.fillRect(x-6, y-6, w+12, h+12);
    const sky = ctx.createLinearGradient(0, y, 0, y+h);
    sky.addColorStop(0, '#bfe6ff');
    sky.addColorStop(1, '#e7f6ff');
    ctx.fillStyle = sky;
    ctx.fillRect(x, y, w, h);
    // 해
    ctx.fillStyle = '#ffe08a';
    ctx.beginPath(); ctx.arc(x + w*0.72, y + h*0.3, 16, 0, Math.PI*2); ctx.fill();
    // 구름
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(x + w*0.3, y + h*0.55, 13, 0, Math.PI*2);
    ctx.arc(x + w*0.42, y + h*0.55, 16, 0, Math.PI*2);
    ctx.arc(x + w*0.55, y + h*0.55, 12, 0, Math.PI*2); ctx.fill();
    // 창틀 격자
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 5;
    ctx.strokeRect(x, y, w, h);
    ctx.beginPath();
    ctx.moveTo(x + w/2, y); ctx.lineTo(x + w/2, y + h);
    ctx.moveTo(x, y + h/2); ctx.lineTo(x + w, y + h/2);
    ctx.stroke();
  }

  function drawClock(cx, cy, r) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = '#222'; ctx.lineWidth = 3;
    const t = frame * 0.02;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(t)*r*0.5, cy + Math.sin(t)*r*0.5); ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(t*4)*r*0.7, cy + Math.sin(t*4)*r*0.7); ctx.stroke();
  }

  function drawBackground() {
    if (stage === 4) { drawByeongBackground(); return; }
    if (stage === 3) { drawNoiseBackground(); return; }
    if (stage === 2) { drawStudioBackground(); return; }
    // 벽 (크림색)
    ctx.fillStyle = '#e9e1cc';
    ctx.fillRect(0, 0, W, GROUND_Y);
    // 천장 몰딩
    ctx.fillStyle = '#d6c9a8';
    ctx.fillRect(0, 0, W, 14);

    // 창문 (오른쪽 위)
    drawWindow(720, 56, 175, 120);
    // 시계 (왼쪽 위, HUD 아래쪽이라 가운데로)
    drawClock(610, 96, 26);

    // 칠판 (가운데)
    const bx = 250, by = 44, bw = 320, bh = 150;
    ctx.fillStyle = '#9c6b3a';                        // 나무 프레임
    roundRect(bx-12, by-12, bw+24, bh+24, 8); ctx.fill();
    ctx.fillStyle = '#33503f';                        // 칠판면
    roundRect(bx, by, bw, bh, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    roundRect(bx, by, bw, bh, 4); ctx.fill();
    // 분필 글씨
    ctx.fillStyle = 'rgba(244,241,232,0.92)';
    ctx.textAlign = 'center';
    ctx.font = 'bold 30px "Comic Sans MS","Trebuchet MS"';
    ctx.fillText('SONGDIH 2.0', bx + bw/2, by + 52);
    ctx.fillStyle = 'rgba(255,224,138,0.9)';
    ctx.font = '15px "Comic Sans MS"';
    ctx.fillText('오늘의 수업', bx + bw/2, by + 84);
    ctx.fillText('방귀의 달인', bx + bw/2, by + 110);
    ctx.strokeStyle = 'rgba(244,241,232,0.45)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bx+90, by+120); ctx.lineTo(bx+bw-90, by+120); ctx.stroke();
    ctx.textAlign = 'left';
    // 분필 받침
    ctx.fillStyle = '#7a5230';
    ctx.fillRect(bx-12, by+bh+8, bw+24, 8);

    // 바닥 (나무 마루)
    ctx.fillStyle = '#b5793f';
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    ctx.strokeStyle = 'rgba(80,45,20,0.35)'; ctx.lineWidth = 2;
    for (let x = 0; x < W; x += 64) {
      ctx.beginPath(); ctx.moveTo(x + (frame*0)%64, GROUND_Y); ctx.lineTo(x, H); ctx.stroke();
    }
    // 걸레받이
    ctx.fillStyle = '#8a5a2b';
    ctx.fillRect(0, GROUND_Y - 7, W, 7);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(0, GROUND_Y - 7, W, 2);
  }

  function drawPlayer() {
    const p = player;
    const cx = p.x + p.w/2;

    // 대쉬 잔상 (깜빡임과 무관하게 항상)
    for (const tr of p.trail) {
      ctx.globalAlpha = clamp(tr.life / 9, 0, 1) * 0.4;
      ctx.fillStyle = '#7fe3ff';
      ctx.fillRect(tr.x, tr.y + 15, p.w, p.h - 15);
    }
    ctx.globalAlpha = 1;

    if ((p.invuln > 0 || p.castTimer > 0) && Math.floor(frame / 4) % 2 === 0) return;  // 무적 깜빡임

    // 그림자 (스테이지1: 바닥 / 스테이지2: 발밑)
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    const shadowY = stage === 1 ? GROUND_Y - 2 : (p.onGround ? p.y + p.h + 2 : -50);
    if (shadowY > 0) { ctx.ellipse(cx, shadowY, 18 * p.sx, 5, 0, 0, Math.PI*2); ctx.fill(); }

    // 몸/머리 — 발밑 기준 스쿼시·스트레치
    ctx.save();
    const feetX = cx, feetY = p.y + p.h;
    ctx.translate(feetX, feetY);
    ctx.scale(p.sx, p.sy);
    ctx.translate(-feetX, -feetY);
    // 몸 (검은 테두리)
    ctx.fillStyle = p.dashTimer > 0 ? '#7fe3ff' : '#4ec5f1';
    ctx.fillRect(p.x, p.y + 15, p.w, p.h - 15);
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#13161c';
    ctx.strokeRect(p.x, p.y + 15, p.w, p.h - 15);
    // 머리 (검은 테두리)
    ctx.fillStyle = '#ffe0bd';
    ctx.beginPath();
    ctx.arc(cx, p.y + 10, 11, 0, Math.PI*2);
    ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#13161c';
    ctx.stroke();
    // 눈
    ctx.fillStyle = '#1b2030';
    ctx.fillRect(cx + (p.facing>0?1:-6), p.y + 7, 5, 5);
    ctx.restore();

    if (p.meleeTimer > 0) {
      const prog = (12 - p.meleeTimer) / 12;            // 0 → 1 (휘두름 진행)
      ctx.save();
      let ox, oy, baseRot, sx;
      if (p.meleeDir === 'up')        { ox = cx;            oy = p.y;            baseRot = -Math.PI/2; sx = 1; }
      else if (p.meleeDir === 'down') { ox = cx;            oy = p.y + p.h;      baseRot =  Math.PI/2; sx = 1; }
      else { ox = p.facing > 0 ? p.x + p.w : p.x; oy = p.y + p.h * 0.5; baseRot = 0; sx = p.facing; }
      ctx.translate(ox, oy);
      ctx.rotate(baseRot + sx * (-0.5 + prog * 0.9));   // 휘두르는 회전
      const rm = p.rangeMul || 1;
      ctx.scale(sx * 1.45 * rm, 1.45);
      ctx.globalAlpha = Math.sin(prog * Math.PI);        // 페이드 인/아웃
      // 나이키 스우시 모양 (밝은 노랑 + 검은 외곽선)
      ctx.beginPath();
      ctx.moveTo(-12, 12);
      ctx.bezierCurveTo(2, 19, 26, 7, 60, -22);
      ctx.lineTo(51, -7);
      ctx.bezierCurveTo(24, 8, 6, 13, -7, 7);
      ctx.closePath();
      ctx.fillStyle = '#fff2a8';
      ctx.fill();
      ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1a1a1a';
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawLaser() {
    if (!laser) return;
    const sx = laser.dir > 0 ? player.x + player.w : 0;
    const ex = laser.dir > 0 ? W : player.x;
    const t = Math.min(1, laser.life / 22);
    ctx.save();
    ctx.globalAlpha = 0.4 + 0.6 * t;
    const grd = ctx.createLinearGradient(sx, 0, ex, 0);
    grd.addColorStop(0, '#e9c6ff');
    grd.addColorStop(1, '#8a2bff');
    ctx.fillStyle = grd;
    const hh = laser.h * (0.5 + 0.5*t);
    const lx = Math.min(sx,ex), lw = Math.abs(ex-sx);
    ctx.fillRect(lx, laser.y + (laser.h-hh)/2, lw, hh);
    ctx.globalAlpha = 1;
    // 진한 보라 외곽선
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#3a0a6e';
    ctx.strokeRect(lx, laser.y + (laser.h-hh)/2, lw, hh);
    // 밝은 코어
    ctx.fillStyle = '#fff';
    ctx.fillRect(lx, laser.y + laser.h/2 - 2, lw, 4);
    ctx.restore();
  }

  function drawBoss() {
    if (boss.type === 'hansubal') { drawBossHansubal(); return; }
    if (boss.type === 'skirr') { drawBossSkirr(); return; }
    if (boss.type === 'byeong') { drawBossByeong(); return; }
    const b = boss;
    const cx = b.x + b.w/2;
    const sitting = (b.state === 'fart_active' || b.state === 'fart_windup');
    const yOff = Math.sin(b.bob) * 4 + (sitting ? 40 : 0);
    const top = b.y + yOff;
    const hh = sitting ? b.h - 40 : b.h;

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(cx, GROUND_Y - 2, 32, 8, 0, 0, Math.PI*2);
    ctx.fill();

    // 몸통 (감귤색 옷 + 검은 테두리)
    ctx.fillStyle = b.flash > 0 ? '#ffffff' : '#f5852a';
    ctx.fillRect(b.x, top + 50, b.w, hh - 50);
    ctx.lineWidth = 3; ctx.strokeStyle = '#241016';
    ctx.strokeRect(b.x, top + 50, b.w, hh - 50);
    // 팔
    const swinging = b.swingTimer > 0;
    if (b.state === 'jab_windup') {
      // 잽 준비: 팔을 위로 번쩍 치켜듦
      ctx.fillStyle = b.flash > 0 ? '#ffffff' : '#ffb24a';
      const ax = b.facing < 0 ? b.x - 22 : b.x + b.w;
      ctx.fillRect(ax, top - 16, 22, 80);
      ctx.fillStyle = b.flash > 0 ? '#ffffff' : '#e08a3a';
      ctx.fillRect(ax - 3, top - 22, 28, 18);   // 주먹
    } else if (!swinging) {
      ctx.fillStyle = b.flash > 0 ? '#ffffff' : '#c75c4c';
      if (b.facing < 0) ctx.fillRect(b.x - 16, top + 64, 16, 16);
      else ctx.fillRect(b.x + b.w, top + 64, 16, 16);
    } else {
      // 위에서 아래로 내려치는 팔 (세로 범위공격, 바닥까지)
      const reach = 88;
      const ax = b.facing < 0 ? b.x - reach : b.x + b.w;
      const armW = 24;
      const fistX = b.facing < 0 ? ax : ax + reach - armW;
      ctx.fillStyle = b.flash > 0 ? '#ffffff' : '#ffb24a';
      ctx.lineWidth = 3; ctx.strokeStyle = '#241016';
      // 어깨에서 가로로 뻗은 윗팔
      const upX = b.facing < 0 ? ax : b.x + b.w;
      ctx.fillRect(upX, top + 40, reach, 22);
      ctx.strokeRect(upX, top + 40, reach, 22);
      // 손에서 바닥까지 내려치는 세로팔
      ctx.fillRect(fistX, top + 40, armW, GROUND_Y - (top + 40));
      ctx.strokeRect(fistX, top + 40, armW, GROUND_Y - (top + 40));
      // 주먹
      ctx.fillStyle = b.flash > 0 ? '#ffffff' : '#e08a3a';
      ctx.fillRect(fistX - 4, GROUND_Y - 26, armW + 8, 26);
      ctx.strokeRect(fistX - 4, GROUND_Y - 26, armW + 8, 26);
    }
    // 다리 (가늘게)
    if (!sitting) {
      ctx.fillStyle = b.flash > 0 ? '#ffffff' : '#7a3d34';
      ctx.fillRect(b.x + 8, top + hh - 4, 16, 8);
      ctx.fillRect(b.x + b.w - 24, top + hh - 4, 16, 8);
    }
    // 머리 (검은 테두리)
    ctx.fillStyle = b.flash > 0 ? '#ffffff' : '#ffd0a8';
    ctx.beginPath();
    ctx.arc(cx, top + 30, 24, 0, Math.PI*2);
    ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#241016';
    ctx.stroke();
    // 머리카락
    ctx.fillStyle = '#2c2230';
    ctx.beginPath();
    ctx.arc(cx, top + 25, 24, Math.PI, 0);
    ctx.fill();
    // 눈
    ctx.fillStyle = '#1b2030';
    ctx.fillRect(cx + (b.facing<0 ? -13 : 5), top + 28, 8, 6);
    // 입
    ctx.fillStyle = '#7a2b2b';
    const mouthOpen = b.roar ? 20 : ((b.state === 'burp_windup' || b.state === 'burp_fire') ? 9 : 3);
    ctx.fillRect(cx - (b.roar ? 12 : 8), top + 40, b.roar ? 24 : 16, mouthOpen);

  }

  function drawProjectiles() {
    for (const z of fartZones) {
      const fade = z.life < 30 ? z.life / 30 : 1;     // 사라질 때 옅어짐
      const a = (0.55 + 0.25 * Math.abs(Math.sin(frame * 0.2))) * fade;
      // 가스 구름
      ctx.fillStyle = `rgba(120,235,70,${a*0.45})`;
      ctx.fillRect(z.x, GROUND_Y - 40, z.w, 26);
      // 바닥 위험 띠 (진한 초록 + 외곽선)
      ctx.fillStyle = `rgba(90,210,50,${a})`;
      ctx.fillRect(z.x, GROUND_Y - 14, z.w, 14);
      ctx.lineWidth = 2.5; ctx.strokeStyle = `rgba(30,90,20,${fade})`;
      ctx.strokeRect(z.x, GROUND_Y - 14, z.w, 14);
      // 경고 빗금
      ctx.strokeStyle = `rgba(255,255,255,${0.35*fade})`; ctx.lineWidth = 2;
      for (let sx = z.x + 6; sx < z.x + z.w; sx += 16) {
        ctx.beginPath(); ctx.moveTo(sx, GROUND_Y - 12); ctx.lineTo(sx - 8, GROUND_Y - 2); ctx.stroke();
      }
    }
    for (const b of burps) {
      const pr = b.r * (1 + 0.14 * Math.sin(frame * 0.4 + b.age * 0.5));   // 꿀렁이는 펄스
      // 가속 시 꼬리
      if (b.boosted) {
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = '#9be84a';
        ctx.beginPath(); ctx.arc(b.x - b.dirx*b.r, b.y - b.diry*b.r, pr*0.8, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = b.boosted ? '#9be84a' : '#7fc24a';
      ctx.beginPath();
      ctx.arc(b.x, b.y, pr, 0, Math.PI*2);
      ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#33571f';   // 진한 외곽선
      ctx.stroke();
      ctx.fillStyle = 'rgba(60,110,40,0.6)';              // 안쪽 음영
      ctx.beginPath();
      ctx.arc(b.x - b.dirx*7, b.y - b.diry*7, pr*0.5, 0, Math.PI*2);
      ctx.fill();
    }
    // 음파
    for (const wv of waves) {
      const a = clamp(1 - wv.r / wv.maxR, 0, 1);
      ctx.globalAlpha = 0.7 * a;
      ctx.lineWidth = 8; ctx.strokeStyle = '#b9a0ff';
      ctx.beginPath(); ctx.arc(wv.x, wv.y, wv.r, 0, Math.PI*2); ctx.stroke();
      ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(wv.x, wv.y, wv.r, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // 네온 네모
    for (const s of neonSquares) {
      const a = clamp(s.life / 32, 0, 1);
      ctx.globalAlpha = 0.85 * a;
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff';
      ctx.strokeRect(s.x, s.y, s.w, s.h);
      ctx.globalAlpha = 1;
    }
    if (stage === 4) drawByeongEntities();
    // 2페이즈 빨간 네모
    for (const rb of redBlocks) {
      const a = clamp(rb.life / 130, 0, 1);
      ctx.globalAlpha = 0.5 + 0.5 * a;
      ctx.fillStyle = '#e23b3b';
      ctx.fillRect(rb.x, rb.y, rb.w, rb.h);
      ctx.fillStyle = 'rgba(255,150,120,0.6)';
      ctx.fillRect(rb.x, rb.y, rb.w, 4);
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#5a1010';
      ctx.strokeRect(rb.x, rb.y, rb.w, rb.h);
      ctx.globalAlpha = 1;
    }
    // 가사 총알
    ctx.textAlign = 'center';
    for (const bl of bullets) {
      ctx.save();
      ctx.shadowColor = '#7b5bff'; ctx.shadowBlur = 12;
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 26px "Trebuchet MS", sans-serif';
      ctx.fillText(bl.ch, bl.x, bl.y);
      ctx.restore();
    }
    ctx.textAlign = 'left';
    // 불타는 마이크 (빙빙 회전)
    for (const m of micProjs) {
      const r = 8 * m.size;
      // 불꽃 (회전과 무관, 중심)
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = '#ffb24a';
      ctx.beginPath(); ctx.arc(m.x, m.y, r + 6 + Math.sin(frame*0.6)*3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ff5b2b';
      ctx.beginPath(); ctx.arc(m.x, m.y, r + 2, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.translate(m.x, m.y); ctx.rotate(m.rot);
      // 손잡이
      ctx.strokeStyle = '#444'; ctx.lineWidth = r*0.5;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, r*1.9); ctx.stroke();
      // 마이크 머리
      ctx.fillStyle = '#bbb'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#333'; ctx.stroke();
      ctx.restore();
    }
    // 67시계 경고 / 폭발
    ctx.textAlign = 'center';
    for (const cw of clockWarns) {
      if (cw.timer > 0) {
        const t = cw.timer / 60;
        ctx.globalAlpha = 0.45 + 0.4 * Math.abs(Math.sin(frame*0.4));
        ctx.lineWidth = 3; ctx.strokeStyle = '#5b8cff';
        ctx.beginPath(); ctx.arc(cw.x, cw.y, 42, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.arc(cw.x, cw.y, 42 * t, 0, Math.PI*2); ctx.stroke();   // 줄어드는 타이머 링
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#5b8cff'; ctx.font = 'bold 20px "Trebuchet MS", sans-serif';
        ctx.fillText('!', cw.x, cw.y + 7);
      } else {
        const s = clamp((cw.timer + 14) / 14, 0, 1);   // 1 → 0
        const pop = 1.4 - 0.4 * s;
        ctx.globalAlpha = s;
        ctx.fillStyle = '#0c2a55'; ctx.beginPath(); ctx.arc(cw.x, cw.y, 32*pop, 0, Math.PI*2); ctx.fill();
        ctx.lineWidth = 4; ctx.strokeStyle = '#5b8cff'; ctx.stroke();
        ctx.fillStyle = '#bcd2ff'; ctx.font = 'bold ' + Math.round(28*pop) + 'px "Trebuchet MS", sans-serif';
        ctx.fillText('67', cw.x, cw.y + 10*pop);
        ctx.globalAlpha = 1;
      }
    }
    ctx.textAlign = 'left';
    // 레이저 조준 텔레그래프 (기 모으는 동안)
    if (boss && boss.type === 'hansubal' && boss.state === 'p3_charge') {
      const ox = boss.x+boss.w/2, oy = boss.y+40;
      const dx = Math.cos(boss.laserAim), dy = Math.sin(boss.laserAim);
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.3 * Math.abs(Math.sin(frame*0.5));
      ctx.setLineDash([16, 12]); ctx.lineWidth = 6; ctx.strokeStyle = '#ffe14a';
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + dx*1100, oy + dy*1100); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
      ctx.restore();
    }
    // 음표 레이저
    if (noteLaser) {
      const dx = Math.cos(noteLaser.ang), dy = Math.sin(noteLaser.ang);
      const ex = noteLaser.x + dx*1100, ey = noteLaser.y + dy*1100;
      const lw = noteLaser.w || 16;
      ctx.save();
      ctx.globalAlpha = 0.45 + 0.3*Math.abs(Math.sin(frame*0.5));
      ctx.lineWidth = lw * 2.8; ctx.strokeStyle = 'rgba(255,225,74,0.3)';
      ctx.beginPath(); ctx.moveTo(noteLaser.x, noteLaser.y); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.lineWidth = lw; ctx.strokeStyle = '#ffe14a';
      ctx.beginPath(); ctx.moveTo(noteLaser.x, noteLaser.y); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#7a5a00'; ctx.font = 'bold 18px serif'; ctx.textAlign = 'center';
      for (let d = 24; d < 1100; d += 56) ctx.fillText('♪', noteLaser.x + dx*d, noteLaser.y + dy*d + 6);
      ctx.restore(); ctx.textAlign = 'left';
    }
    // 하학! 지뢰 (2페이즈)
    ctx.textAlign = 'center';
    for (const m of hanMines) {
      if (m.life <= 0) continue;
      m.pulse = (m.pulse || 0) + 0.12;
      const sc = 1 + 0.15 * Math.abs(Math.sin(m.pulse));
      ctx.save();
      ctx.shadowColor = '#ff5b6e'; ctx.shadowBlur = 14 + 8*Math.abs(Math.sin(m.pulse));
      ctx.globalAlpha = 0.85 + 0.15*Math.abs(Math.sin(m.pulse));
      ctx.font = `bold ${Math.round(22*sc)}px "Trebuchet MS", sans-serif`;
      ctx.fillStyle = '#ff5b6e';
      ctx.fillText('하학!', m.x, m.y - 10);
      ctx.fillStyle = 'rgba(255,91,110,0.35)';
      ctx.beginPath(); ctx.arc(m.x, m.y - 20, 28*sc, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    ctx.textAlign = 'left';
    // 노란 음표
    ctx.textAlign = 'center';
    for (const nt of notes) {
      ctx.save(); ctx.shadowColor = '#ffe14a'; ctx.shadowBlur = 8;
      ctx.fillStyle = '#ffe14a'; ctx.font = 'bold 24px serif';
      ctx.fillText('♪', nt.x, nt.y);
      ctx.restore();
    }
    // "하학!"
    for (const lh of laughs) {
      ctx.fillStyle = '#ff5b6e';
      ctx.font = 'bold ' + Math.round(lh.size*1.5) + 'px "Trebuchet MS", sans-serif';
      ctx.fillText('하학!', lh.x, lh.y);
    }
    ctx.textAlign = 'left';
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / 30, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    // 맵 전체공격 플래시
    if (mapAtk > 0) {
      ctx.globalAlpha = (mapAtk / 16) * 0.6;
      ctx.fillStyle = '#9be84a';
      ctx.fillRect(-60, -60, W+120, H+120);
      ctx.globalAlpha = 1;
    }
  }

  function drawHUD() {
    // 보스 체력바 (상단)
    if (boss && boss.hp > 0) {
      const bw = W - 360, bx = (W - bw) / 2 + 40, by = 16, bh = 18;
      const ratio = clamp(boss.hp / boss.maxHp, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      roundRect(bx - 4, by - 4, bw + 8, bh + 8, 6); ctx.fill();
      ctx.fillStyle = '#2a2030';
      roundRect(bx, by, bw, bh, 5); ctx.fill();
      const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      if (boss.type === 'hansubal') { g.addColorStop(0, '#2bbf6a'); g.addColorStop(1, '#9be84a'); }
      else if (boss.type === 'skirr') { g.addColorStop(0, '#8a2bff'); g.addColorStop(1, '#ff5bd0'); }
      else if (boss.type === 'byeong') { g.addColorStop(0, '#c86fa0'); g.addColorStop(1, '#ff6b8e'); }
      else { g.addColorStop(0, '#ff5b5b'); g.addColorStop(1, '#ff9a3d'); }
      ctx.fillStyle = g;
      if (ratio > 0) { roundRect(bx, by, Math.max(6, bw * ratio), bh, 5); ctx.fill(); }
      ctx.lineWidth = 2; ctx.strokeStyle = '#fff';
      roundRect(bx, by, bw, bh, 5); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px "Trebuchet MS", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(boss.type === 'hansubal' ? 'Hansubal' : (boss.type === 'skirr' ? 'skirr boi' : (boss.type === 'byeong' ? '병현?' : 'Ssunang')), W/2 + 40, by + bh - 4);
      ctx.textAlign = 'left';
    }
    // 좌상단 패널 (단순 네모)
    const px = 14, py = 12, pw = 256, ph = 78;
    ctx.fillStyle = 'rgba(20,24,34,0.82)';
    roundRect(px, py, pw, ph, 8); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#4a5470';
    roundRect(px, py, pw, ph, 8); ctx.stroke();

    // 체력 (하트)
    ctx.fillStyle = '#cfd7f5';
    ctx.font = 'bold 14px "Trebuchet MS", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('체력', px+18, py+28);
    for (let i = 0; i < player.maxHp; i++) {
      ctx.fillStyle = i < player.hp ? '#ff5b6e' : '#444b66';
      drawHeart(px+70 + i*26, py+18, 9);
    }
    // 특수 게이지
    ctx.fillStyle = '#cfd7f5';
    ctx.fillText('특수', px+18, py+62);
    const gx = px+62, gy = py+50, gw = 176, gh = 16;
    ctx.fillStyle = '#222a40';
    roundRect(gx, gy, gw, gh, 8); ctx.fill();
    const sr = player.special / player.maxSpecial;
    const sg = ctx.createLinearGradient(gx, 0, gx+gw, 0);
    sg.addColorStop(0, '#7ab86a');
    sg.addColorStop(1, '#bfe88a');
    ctx.fillStyle = sg;
    if (sr > 0) { roundRect(gx, gy, Math.max(gh, gw*sr), gh, 8); ctx.fill(); }
    ctx.strokeStyle = '#b8ad95'; ctx.lineWidth = 2;
    roundRect(gx, gy, gw, gh, 8); ctx.stroke();
    const ready = player.special >= player.maxSpecial;
    ctx.fillStyle = ready ? '#0a2a0a' : '#e8edff';
    ctx.font = 'bold 11px "Trebuchet MS", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ready ? '★ 준비완료!' : Math.floor(player.special) + '%', gx + gw/2, gy + 12);
    ctx.textAlign = 'left';
    if (ready && Math.floor(frame/8)%2===0) {
      ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 2;
      roundRect(gx-2, gy-2, gw+4, gh+4, 9); ctx.stroke();
    }
  }

  function drawHeart(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s*0.3);
    ctx.bezierCurveTo(x, y, x - s, y, x - s, y + s*0.3);
    ctx.bezierCurveTo(x - s, y + s*0.7, x, y + s, x, y + s*1.3);
    ctx.bezierCurveTo(x, y + s, x + s, y + s*0.7, x + s, y + s*0.3);
    ctx.bezierCurveTo(x + s, y, x, y, x, y + s*0.3);
    ctx.fill();
  }

  function drawFloatTexts() {
    ctx.textAlign = 'center';
    for (const t of floatTexts) {
      ctx.globalAlpha = clamp(t.life / 40, 0, 1);
      ctx.fillStyle = t.color;
      ctx.font = 'bold 20px "Trebuchet MS", sans-serif';
      ctx.fillText(t.txt, t.x, t.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  // ---------- 화면 ----------
  function startBtn() { return { x: W/2 - 130, y: 330, w: 260, h: 48 }; }
  function shopBtn()  { return { x: W/2 - 200, y: 392, w: 190, h: 44 }; }
  function equipBtn() { return { x: W/2 + 10,  y: 392, w: 190, h: 44 }; }
  function loginBtn() { return { x: W - 154, y: 14, w: 140, h: 30 }; }
  function backBtn()  { return { x: 24, y: H - 56, w: 130, h: 40 }; }
  function unequipAllBtn() { return { x: 168, y: H - 56, w: 170, h: 40 }; }
  function backBtn2() { return { x: W/2 - 90, y: 330, w: 180, h: 52 }; }
  function buyBtn()   { return { x: W/2 - 80, y: 300, w: 160, h: 44 }; }
  function schemeChip(i) { return { x: W/2 + (i === 0 ? -200 : 14), y: 232, w: 186, h: 60 }; }
  function drawWoodButton(btn, label) {
    const blink = Math.floor(frame/22)%2===0;
    ctx.fillStyle = blink ? '#caa15f' : '#b5793f';
    roundRect(btn.x, btn.y, btn.w, btn.h, 12); ctx.fill();
    ctx.strokeStyle = '#6e4523'; ctx.lineWidth = 4;
    roundRect(btn.x, btn.y, btn.w, btn.h, 12); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    roundRect(btn.x+5, btn.y+5, btn.w-10, 14, 8); ctx.fill();
    ctx.fillStyle = '#fff8e8';
    ctx.textAlign = 'center';
    ctx.font = 'bold 27px "Comic Sans MS","Trebuchet MS"';
    ctx.fillText(label, W/2, btn.y + 40);
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function drawPlainButton(b, label, col) {
    ctx.fillStyle = col || '#2c3450';
    roundRect(b.x, b.y, b.w, b.h, 8); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#1a2030'; roundRect(b.x, b.y, b.w, b.h, 8); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = 'bold 18px "Trebuchet MS", sans-serif';
    ctx.fillText(label, b.x + b.w/2, b.y + b.h/2 + 6);
    ctx.textAlign = 'left';
  }
  function drawGoldLogin() {
    // 로그인 / 골드 (우상단)
    const lb = loginBtn();
    drawPlainButton(lb, currentUser ? ('👤 ' + currentUser) : '로그인', currentUser ? '#33503f' : '#8a3b3b');
